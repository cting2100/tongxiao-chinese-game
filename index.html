<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>國語大作戰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#0a0a1a,#1a1040,#0d1b2a);min-height:100vh;display:flex;align-items:center;justify-content:center}
.ct{width:95vw;max-width:820px;background:rgba(255,255,255,.96);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 40px rgba(124,92,231,.1);padding:28px 20px;text-align:center}
.scr{display:none}.scr.on{display:block;animation:fi .4s}
@keyframes fi{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.cover{font-size:2.2em;font-weight:900;background:linear-gradient(135deg,#f59e0b,#ef4444,#8b5cf6,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:300% 300%;animation:shimmer 3s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
h1{font-size:1.7em;margin-bottom:6px;font-weight:900}h2{font-size:1.15em;color:#5b3a8c;margin-bottom:8px}
.btn{display:inline-block;padding:10px 24px;border:none;border-radius:12px;font-size:.95em;font-weight:700;cursor:pointer;transition:all .25s;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.15)}.btn:active{transform:translateY(0)}
.btn-p{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff}.btn-s{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}.btn-w{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a1a2e}
.btn-lg{padding:14px 42px;font-size:1.25em;border-radius:16px}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.inp{margin:14px 0}.inp label{display:block;font-size:1em;color:#2d1b69;font-weight:700;margin-bottom:6px}
.inp input{width:100%;max-width:280px;padding:12px 16px;border:3px solid #d4c8f0;border-radius:14px;font-size:1.1em;text-align:center;outline:none;transition:all .3s;background:#faf8ff}
.inp input:focus{border-color:#7c5ce7;box-shadow:0 0 0 4px rgba(124,92,231,.15);background:#fff}
.pbar{background:rgba(124,92,231,.08);height:10px;border-radius:5px;margin:10px 0;overflow:hidden}.pbar-f{background:linear-gradient(90deg,#7c5ce7,#a855f7,#10b981);height:100%;border-radius:5px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px;flex-wrap:wrap}
.badge{padding:5px 14px;border-radius:14px;font-size:.78em;font-weight:700}
.bs{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff;box-shadow:0 2px 8px rgba(124,92,231,.3)}.bg2{background:#f3effa;color:#5b3a8c;border:1px solid #e8e0f5}
.fb{margin:6px 0;min-height:20px;font-size:.95em;font-weight:700}.fb.ok{color:#059669}.fb.ng{color:#dc2626}
.explain{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-left:3px solid #10b981;padding:10px 14px;border-radius:0 10px 10px 0;margin:6px 0;font-size:.84em;text-align:left;line-height:1.6;color:#065f46;display:none}
.hint-box{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:2px solid #fbbf24;border-radius:10px;padding:10px 14px;margin:6px 0;font-size:.82em;text-align:left;color:#92400e;display:none;box-shadow:0 2px 8px rgba(245,158,11,.1)}.hint-box b{color:#d97706}
.story-box{background:linear-gradient(135deg,#f0f0ff,#f5f3ff);border:2px solid #c4b5fd;border-radius:12px;padding:12px;margin:6px 0;font-size:.85em;text-align:left;line-height:1.8;color:#2d1b69;max-height:180px;overflow-y:auto;box-shadow:0 2px 8px rgba(124,92,231,.05)}
.tip-inline{background:linear-gradient(135deg,#ede9fe,#f5f3ff);border:1px solid #c4b5fd;border-radius:10px;padding:8px 12px;margin:4px 0;font-size:.8em;color:#6d28d9;text-align:left;box-shadow:0 1px 4px rgba(124,92,231,.08)}
.sort-zone{display:flex;flex-direction:column;gap:6px;margin:6px 0;min-height:44px;padding:6px;border:2px dashed #d1d4fa;border-radius:10px;background:#faf8ff}
.sort-card{padding:10px 14px;background:#fff;border:2px solid #c4b5fd;border-radius:10px;cursor:grab;font-size:.88em;text-align:left;transition:all .2s;color:#2d1b69;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.sort-card:hover{border-color:#a78bfa;box-shadow:0 4px 12px rgba(124,92,231,.1)}.sort-card:active{cursor:grabbing}.sort-card.drag-over{border-color:#7c5ce7;background:#ede9fe}
.drag-pair{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.drag-col{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.drag-card{padding:12px 16px;background:#fff;border:2px solid #c4b5fd;border-radius:10px;font-size:.88em;cursor:grab;text-align:center;transition:all .2s;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.drag-card:hover{border-color:#a78bfa;box-shadow:0 4px 12px rgba(124,92,231,.1)}.drag-card:active{cursor:grabbing}
.drag-card.ok{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border-color:#10b981;cursor:default}.drag-card.drop-hover{border-color:#7c5ce7;background:#ede9fe}
.drag-label{font-size:.8em;color:#9c8cb5;font-weight:700;margin-bottom:4px;text-align:center}
.tc-drag{display:flex;gap:8px;margin:8px 0;justify-content:center}
.tc-dcol{flex:1;border:2px dashed #c4b5fd;border-radius:10px;padding:10px;min-height:100px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#faf8ff}.tc-dcol h4{font-size:.82em;color:#6d28d9;margin-bottom:4px}.tc-dcol.drag-over{border-color:#7c5ce7;background:#ede9fe}
.drag-chip{padding:7px 14px;background:#fff;border:2px solid #a78bfa;border-radius:8px;font-size:.82em;cursor:grab;transition:all .2s;user-select:none;box-shadow:0 2px 4px rgba(0,0,0,.04)}.drag-chip:active{cursor:grabbing}
.fill-p{font-size:.9em;line-height:1.8;text-align:left;margin:6px 0;color:#2d1b69}
.fill-gap{display:inline-block;width:40px;text-align:center;border-bottom:2px dashed #f59e0b;margin:0 3px;cursor:pointer;font-size:1.2em;font-weight:bold;color:#d97706}
.ppal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.pp{padding:8px 14px;background:#fff;border:2px solid #fbbf24;border-radius:8px;cursor:pointer;font-size:1.1em;transition:all .2s}.pp:hover{background:#fef3c7}
.stats{margin:10px auto;max-width:420px}.sr{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #e8e0f5;font-size:.95em}.sr:last-child{border-bottom:none}.sl{color:#7c6ba0}.sv{color:#2d1b69;font-weight:700}
.diag-box{background:linear-gradient(135deg,#fafafa,#f5f5f5);border:2px solid #e8e0f5;border-radius:12px;padding:12px;margin:10px auto;max-width:480px}.diag-box h3{color:#5b3a8c;font-size:.9em;margin-bottom:8px}
.diag-bar{margin:5px 0;display:flex;align-items:center;gap:6px}.diag-label{width:72px;text-align:right;font-size:.78em;color:#5b3a8c;font-weight:700}
.diag-track{flex:1;height:16px;background:#e8e0f5;border-radius:8px;overflow:hidden}
.diag-fill{height:100%;border-radius:8px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}.dg{background:linear-gradient(90deg,#10b981,#34d399)}.dy{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.dr{background:linear-gradient(90deg,#ef4444,#f87171)}.diag-pct{width:38px;font-size:.72em;color:#7c6ba0}
.confetti{position:fixed;z-index:999;pointer-events:none;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:480px){.ct{padding:14px 8px}h1{font-size:1.3em}.cover{font-size:1.6em}.drag-col{min-width:120px}}
</style>
</head>
<body><div class="ct">

<div class="scr on" id="ss">
  <div style="font-size:2.5em">⚔️</div>
  <h1 class="cover">國語大作戰</h1>
  <h2>13 關挑戰 · 拖曳互動 · 策略闖關 👾</h2>
  <div class="inp"><label for="ni">⚔️ 輸入你的名字，加入作戰：</label><input type="text" id="ni" placeholder="例如：小明" maxlength="20" autocomplete="off"></div>
  <button class="btn btn-p btn-lg" id="bg" disabled>⚔️ 開始作戰 ▶</button>
  <p style="color:#9c8cb5;font-size:.72em;margin-top:6px">v6 · 華麗升級 · 拖曳排序/配對/T圖表 · 答錯只給提示</p>
</div>

<div class="scr" id="sg">
  <div class="gtop"><span class="badge bs" id="sn"></span><span class="badge bg2">⭐ <span id="cs">0</span> 分</span><span class="badge bg2">📝 <span id="qp">1/13</span></span></div>
  <div class="pbar"><div class="pbar-f" id="pb"></div></div>
  <div id="gz"></div>
  <div class="hint-box" id="hb"></div>
  <div class="fb" id="fb"></div><div class="explain" id="ex"></div>
  <div id="btns" style="display:flex;gap:8px;justify-content:center;margin-top:8px"></div>
</div>

<div class="scr" id="se">
  <div style="font-size:3em">🏆</div><h1>作戰完成！</h1>
  <div class="stats"><div class="sr"><span class="sl">戰士</span><span class="sv" id="rn"></span></div><div class="sr"><span class="sl">總分</span><span class="sv" id="rs"></span></div><div class="sr"><span class="sl">通關</span><span class="sv" id="rc"></span></div></div>
  <div class="diag-box" id="diag"></div>
  <button class="btn btn-w btn-lg" id="br" style="margin-top:10px">再戰一次 🔄</button>
</div>

</div>
<script>
const $=id=>document.getElementById(id);
const ALL=[
{day:'Day1',type:'sort',title:'📖 颱風天 — 拖曳排序',tip:'💡 小技巧：找出時間詞（昨天晚上、今天一早、下午、晚上、隔天早上），拖曳排列！',items:['今天一早，窗外風很大，雨一直下','昨天晚上，媽媽說颱風要來了','晚上，颱風慢慢離開，風雨變小了','下午，風雨更大了，還停電了','隔天早上，天氣放晴了'],ans:[1,0,3,2,4],x:'時間順序：昨天晚上→今天一早→下午→晚上→隔天早上。口訣：「時間畫箭頭！」',hint:'💡 提示：找出時間詞，最早發生的拖到最上面，最晚的拖到最下面。',pts:25},
{day:'Day1',type:'choice',title:'📖 勇敢的小烏龜',story:'小烏龜住在池塘邊，牠很膽小，什麼都不敢做。有一天，牠看到高高的石頭上有一朵漂亮的小小花，牠很想爬上去看一看，可是石頭太高了，牠怕摔下來。小鳥飛過來說：「不要怕，慢慢爬，我會陪著你。」小烏龜聽了，鼓起勇氣，一步一步往上爬。雖然爬得很慢，但是牠沒有放棄。最後，小烏龜終於爬到石頭頂端，看到了美麗的小花，也看到了遠方的風景。牠開心極了，對小鳥說：「原來勇敢一點，就可以看到不一樣的世界！」從此以後，小烏龜不再膽小，牠學會了勇敢嘗試。',q:'小烏龜最後學到了什麼道理？',o:['石頭很危險，不要隨便爬','勇敢嘗試，可以看到不一樣的世界','只要有信心，什麼都不用學','小鳥不應該多管閒事'],a:1,x:'小烏龜從膽小變勇敢，牠發現「原來勇敢一點，就可以看到不一樣的世界」！',hint:'💡 提示：故事最後小烏龜對小鳥說了什麼？那句就是答案。',pts:20},
{day:'Day3',type:'choice',title:'💧 四字詞結構',q:'「朵朵白雲」是哪一種結構？',o:['AAB型（疊字在前）','數字型（數字+名詞）','ABCC型（疊字在後）','沒有規律'],a:0,x:'「朵朵白雲」= 朵(疊)+朵(疊)+白+雲 → AAB型。策略：拆→看→歸納！',hint:'💡 提示：拆開看：朵、朵、白、雲。前兩字一樣是疊字在前，叫AAB型。',pts:20},
{day:'Day4',type:'sort',title:'⏰ 做早餐 — 拖曳排序',tip:'💡 小技巧：做事情有先後！先做的拖到最上，後做的拖到最下。',items:['從冰箱拿出吐司和蛋','把吐司放進烤箱烤','把蛋打入鍋子裡煎','坐下來享用美味的早餐'],ans:[0,1,2,3],x:'拿材料→烤吐司→煎蛋→享用。口訣：「時間畫箭頭！」',hint:'💡 提示：先拿材料才能開始煮。吐司烤較久先放，蛋煎很快後放，最後才能吃。',pts:25},
{day:'Day5',type:'pair',title:'🔄 轉折詞 — 拖曳配對',left:['小明很想出去玩','這個包包很漂亮','他個子很小','我已經很累了'],right:['但是外面下大雨，不能出去','可是價錢太貴了，買不起','但是力氣非常大','卻還是把功課寫完了'],ans:[0,1,2,3],x:'轉折詞（但是、可是、卻）後面才是重點！口訣：「轉折詞像路標，重點在後半！」',hint:'💡 提示：把左邊前半句拖到意思相反的後半句上。例如「想出去玩」應配「不能出去」。',pts:25},
{day:'Day5',type:'choice',title:'🔄 轉折 vs 因果',q:'「因為下雨了，所以我帶雨傘。」這是什麼句型？',o:['轉折句（前後相反）','因果句（前因後果）','並列句','條件句'],a:1,x:'下雨（原因）→帶雨傘（結果），因果句。轉折句是「雖然…但是…」。',hint:'💡 提示：有「因為…所以…」就是因果句；有「雖然…但是…」才是轉折句。',pts:20},
{day:'Day6',type:'choice',title:'🧭 無轉折詞找轉折',q:'「說好要去公園玩。下雨了，不能去了。」少了哪個轉折詞？',o:['因為','所以','但是','首先'],a:2,x:'沒有「但是」，但意思轉彎了！本來要去→下雨不能去。',hint:'💡 提示：前面說「要去」，後面說「不能去」——意思相反！哪個詞可以讓意思轉彎？',pts:20},
{day:'Day6',type:'choice',title:'🧭 多重轉折追蹤',q:'小明想學鋼琴，但是家裡沒有鋼琴。他沒有放棄，每天去學校音樂教室練習。然而有一天音樂教室關門了。不過老師看到他的努力，借給他教室鑰匙。最後小明學會了彈鋼琴。\n\n總共發生了幾次轉折？',o:['1次','2次','3次','沒有轉折'],a:2,x:'三次轉折：「但是」、「然而」、「不過」各一次。策略：追蹤轉折詞！',hint:'💡 提示：圈出文中「但是」、「然而」、「不過」——各算一次。',pts:25},
{day:'Day7',type:'sort',title:'✏️ 故事山 — 拖曳排序',tip:'💡 小技巧：故事像爬山！山腳（開始）→上山（經過）→山頂（高潮）→下山（結果）。',items:['比賽開始，小明是第一棒（開始）','順利交棒給第二棒小華（經過）','最後一棒衝向終點，全班歡呼（高潮）','雖然沒得第一，但全班都很開心（結果）'],ans:[0,1,2,3],x:'故事山：開始→經過→高潮→結果。口訣：「故事三兄弟，爬山有意思！」',hint:'💡 提示：山腳開始→上山經過→山頂最刺激→下山回家。最刺激的拖到第三位！',pts:25},
{day:'Day8',type:'choice',title:'📚 小蜜蜂與大象',story:'從前，在美麗的花園裡，住著一隻自大的大象。牠覺得自己最大最厲害，常常欺負小動物。有一天，大象不小心把鼻子卡在樹洞裡，怎麼拉都拉不出來。牠大聲呼救，可是小動物們都不敢靠近。這時，一隻小蜜蜂飛來說：「我來幫你。」大象覺得很好笑：「你這麼小，怎麼可能幫我？」小蜜蜂不理會，飛進樹洞，用尾針輕輕刺了大象鼻子。大象打了個噴嚏——「哈啾！」鼻子就從樹洞裡滑出來了！大象紅著臉說：「謝謝你，我錯了。」小蜜蜂說：「大小不重要，重要的是有一顆願意幫助別人的心。」從此以後，大象變得非常友善。',q:'故事中，大象遇到的「問題」是什麼？',o:['大象不喜歡花園','大象的鼻子卡在樹洞裡','小蜜蜂不願意幫忙','大象想要吃蜂蜜'],a:1,x:'問題=鼻子卡住。解決=蜜蜂刺鼻子。結局=大象變友善。記住5元素！',hint:'💡 提示：童話「問題」=主角的麻煩。大象出了什麼事？從故事找。',pts:20},
{day:'Day8',type:'choice',title:'📚 兩隻小羊 — 找證據',story:'有一天，黑羊和白羊同時走到獨木橋兩端。橋很窄，只能讓一隻羊過。兩隻羊誰也不讓誰，吵了起來，結果撞在一起，雙雙掉進河裡。爬上來後，黑羊說：「對不起，我應該讓你。」白羊也說：「是我太自私了。」牠們決定：黑羊先退到岸邊讓白羊過，然後黑羊再過橋。結果兩隻羊都順利過了橋，還成了好朋友。',q:'兩隻小羊最後為什麼都順利過橋了？',o:['其中一隻放棄過橋','黑羊先退讓白羊過，然後自己再過','牠們找了另一座橋','橋突然變寬了'],a:1,x:'證據：「黑羊先退到岸邊讓白羊過，然後黑羊再過橋。」策略：不是亂猜，要有證據！',hint:'💡 提示：回故事找——牠們最後決定怎麼做？誰先退讓了？',pts:20},
{day:'Day9',type:'tchart',title:'📋 仙人掌 T 圖表 — 拖曳分類',labels:['📐 結構（長什麼樣子）','⚙️ 功能（有什麼用處）'],chips:['粗厚的莖','儲存水分','針狀的葉子','減少水分蒸發','淺而廣的根','可以快速吸收雨水'],ans:{left:['粗厚的莖','針狀的葉子','淺而廣的根'],right:['儲存水分','減少水分蒸發','可以快速吸收雨水']},x:'仙人掌演化儲水構造！口訣：「左邊寫外表，右邊寫功能。」',hint:'💡 提示：左欄放外觀（莖、葉子、根），右欄放功能（儲水、減少蒸發、吸水）。',pts:30},
{day:'Day9',type:'choice',title:'📋 因果關係',q:'「因為沙漠缺水，所以仙人掌的莖可以儲存水分。」因和果是什麼？',o:['因：沙漠缺水／果：莖可儲水','因：莖可儲水／果：沙漠缺水','兩個都是因','兩個都是果'],a:0,x:'因為→原因；所以→結果。口訣：「有因果，用因為所以！因在前果在後。」',hint:'💡 提示：「因為」後面是原因，「所以」後面是結果。',pts:20}
];
const TOTAL=ALL.length;
let pN='',qi=0,sc=0,co=0,wrongCount={},tries=0;
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
const ni=$('ni'),bg=$('bg');
ni.addEventListener('input',()=>{bg.disabled=ni.value.trim().length<1});
ni.addEventListener('keydown',e=>{if(e.key==='Enter'&&!bg.disabled)start()});
bg.addEventListener('click',start);
function start(){pN=ni.value.trim();if(!pN)return;qi=0;sc=0;co=0;wrongCount={};$('cs').textContent='0';$('pb').style.width='0%';run();}
function run(){
  if(qi>=TOTAL){showResult();return;}
  const q=ALL[qi];tries=0;$('sn').textContent=q.day;$('cs').textContent=sc;$('qp').textContent=(qi+1)+'/'+TOTAL;$('fb').textContent='';$('fb').className='fb';$('ex').style.display='none';$('hb').style.display='none';
  $('btns').innerHTML='';$('gz').innerHTML='';
  if(q.type==='sort')buildSort(q);else if(q.type==='pair')buildPair(q);else if(q.type==='tchart')buildTC(q);else buildChoice(q);
  show('sg');$('pb').style.width=(qi/TOTAL*100)+'%';
}
function win(pts,x){
  sc+=pts;co++;$('cs').textContent=sc;$('fb').textContent='🎉 答對了！（+'+pts+' 分）';$('fb').className='fb ok';$('ex').textContent='💡 '+x;$('ex').style.display='block';$('hb').style.display='none';
  confetti();
  const nb=document.createElement('button');nb.className='btn btn-p';nb.textContent='下一關 ▶';nb.addEventListener('click',()=>{qi++;run();});$('btns').innerHTML='';$('btns').appendChild(nb);
}
function lose(x,hint,retry,skip){
  tries++;$('fb').textContent='❌ 不對喔！看提示再試一次！'+(tries>1?'（第'+tries+'次）':'');$('fb').className='fb ng';$('hb').innerHTML=hint;$('hb').style.display='block';$('btns').innerHTML='';
  const rb=document.createElement('button');rb.className='btn btn-w';rb.textContent='🔄 再試一次';rb.addEventListener('click',retry);$('btns').appendChild(rb);
  if(skip){const sb=document.createElement('button');sb.className='btn btn-p';sb.textContent='跳過 ▶';sb.style.marginLeft='6px';sb.addEventListener('click',()=>{qi++;run();});$('btns').appendChild(sb);}
  if(!wrongCount[ALL[qi].day])wrongCount[ALL[qi].day]=0;wrongCount[ALL[qi].day]++;
}
function confetti(){
  const colors=['#f59e0b','#ef4444','#8b5cf6','#10b981','#3b82f6','#ec4899','#fbbf24'];
  for(let i=0;i<30;i++){const el=document.createElement('div');el.className='confetti';el.style.cssText='left:'+Math.random()*100+'%;top:-5vh;width:'+(Math.random()*8+4)+'px;height:'+(Math.random()*8+4)+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+(Math.random()*2+1.5)+'s;animation-delay:'+Math.random()*.5+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}
}
function buildChoice(q){
  let h='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:6px">'+q.title+'</h2>';if(q.story)h+='<div class="story-box">'+q.story+'</div>';h+='<p style="font-size:.92em;color:#1e1040;margin-bottom:8px;line-height:1.6">'+q.q+'</p>';$('gz').innerHTML=h;
  const od=document.createElement('div');od.style.cssText='display:flex;flex-direction:column;gap:6px';const lb=['A','B','C','D'];
  q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='btn';b.style.cssText='text-align:left;background:#fff;border:2px solid #e8e0f5;padding:12px 16px;border-radius:10px;width:100%;font-family:inherit;font-size:.9em;cursor:pointer;color:#2d1b69;transition:all .2s';b.textContent=lb[i]+'. '+o;b.addEventListener('click',()=>{od.querySelectorAll('button').forEach(bb=>bb.disabled=true);if(i===q.a){b.style.borderColor='#10b981';b.style.background='#d1fae5';b.style.fontWeight='700';win(q.pts,q.x);}else{b.style.borderColor='#ef4444';b.style.background='#fee2e2';lose(q.x,q.hint,()=>{buildChoice(q);},true);}});od.appendChild(b);});$('gz').appendChild(od);
}
function buildSort(q){
  let h='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:4px">'+q.title+'</h2>';if(q.tip)h+='<div class="tip-inline">'+q.tip+'</div>';
  h+='<p style="font-size:.78em;color:#7c6ba0;margin-bottom:4px">↕️ 拖曳句子上下移動排列順序</p><div class="sort-zone" id="sz">';
  const items=q.items.slice().sort(()=>Math.random()-.5);
  items.forEach((it,i)=>{h+='<div class="sort-card" draggable="true" data-idx="'+q.items.indexOf(it)+'">'+it+'</div>';});
  h+='</div><div style="margin-top:8px;display:flex;gap:6px;justify-content:center"><button class="btn btn-w" id="sr">🔄 恢復原狀</button><button class="btn btn-s" id="sc">✓ 確定順序</button></div>';$('gz').innerHTML=h;
  const sz=$('sz');
  sz.addEventListener('dragover',e=>{e.preventDefault();});
  sz.addEventListener('drop',e=>{e.preventDefault();const after=getDropIndex(sz,e.clientY);const el=document.querySelector('.sort-card.dragging');if(el&&after!==null){if(after<sz.children.length)sz.insertBefore(el,sz.children[after]);else sz.appendChild(el);}document.querySelectorAll('.sort-card').forEach(c=>c.classList.remove('drag-over'));});
  document.querySelectorAll('.sort-card').forEach(c=>{c.addEventListener('dragstart',function(){this.classList.add('dragging');});c.addEventListener('dragend',function(){this.classList.remove('dragging');});c.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('drag-over');});c.addEventListener('dragleave',function(){this.classList.remove('drag-over');});});
  $('sr').addEventListener('click',()=>{const items2=q.items.slice().sort(()=>Math.random()-.5);sz.innerHTML='';items2.forEach(it=>{const d=document.createElement('div');d.className='sort-card';d.draggable=true;d.dataset.idx=q.items.indexOf(it);d.textContent=it;d.addEventListener('dragstart',function(){this.classList.add('dragging');});d.addEventListener('dragend',function(){this.classList.remove('dragging');});d.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('drag-over');});d.addEventListener('dragleave',function(){this.classList.remove('drag-over');});sz.appendChild(d);});});
  $('sc').addEventListener('click',()=>{const order=Array.from(sz.children).map(c=>parseInt(c.dataset.idx));if(JSON.stringify(order)===JSON.stringify(q.ans))win(q.pts,q.x);else lose(q.x,q.hint,()=>{buildSort(q);},false);});
}
function getDropIndex(container,y){const cards=Array.from(container.querySelectorAll('.sort-card:not(.dragging)'));if(cards.length===0)return 0;for(let i=0;i<cards.length;i++){const rect=cards[i].getBoundingClientRect();if(y<rect.top+rect.height/2)return i;}return cards.length;}
function buildPair(q){
  let h='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:4px">'+q.title+'</h2><p style="font-size:.78em;color:#7c6ba0;margin-bottom:4px">↔️ 把左邊句子拖到對應的右邊句子上</p><div class="drag-pair"><div class="drag-col"><div class="drag-label">📝 前半句</div>';
  q.left.forEach((l,i)=>{h+='<div class="drag-card" draggable="true" data-lidx="'+i+'" id="lc'+i+'">'+l+'</div>';});
  h+='</div><div class="drag-col"><div class="drag-label">🎯 後半句（拖到這裡）</div>';
  q.right.map((r,i)=>({r,i})).sort(()=>Math.random()-.5).forEach(r=>{h+='<div class="drag-card drop-zone" data-ridx="'+r.i+'" id="rc'+r.i+'">'+r.r+'</div>';});
  h+='</div></div><button class="btn btn-s" id="pck" style="margin-top:8px">✓ 我配好了</button>';$('gz').innerHTML=h;
  const matched={};
  document.querySelectorAll('.drag-card[data-lidx]').forEach(c=>{c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',this.dataset.lidx);this.classList.add('dragging');});c.addEventListener('dragend',function(){this.classList.remove('dragging');});});
  document.querySelectorAll('.drop-zone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drop-hover');});z.addEventListener('dragleave',()=>{z.classList.remove('drop-hover');});z.addEventListener('drop',function(e){e.preventDefault();this.classList.remove('drop-hover');const li=parseInt(e.dataTransfer.getData('text/plain'));const ri=parseInt(this.dataset.ridx);if(q.ans[li]===ri){document.getElementById('lc'+li).classList.add('ok');this.classList.add('ok');matched[li]=ri;}else{document.getElementById('lc'+li).style.borderColor='#ef4444';this.style.borderColor='#ef4444';setTimeout(()=>{document.getElementById('lc'+li).style.borderColor='#c4b5fd';this.style.borderColor='#c4b5fd';},500);}});});
  $('pck').addEventListener('click',()=>{const allOk=Object.keys(matched).length===q.left.length;if(allOk)win(q.pts,q.x);else{$('fb').textContent='還有沒配對完的！請將左邊全部拖到右邊。';$('fb').className='fb ng';}});
}
function buildTC(q){
  $('gz').innerHTML='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:4px">'+q.title+'</h2><p style="font-size:.76em;color:#7c6ba0;margin-bottom:4px">↔️ 拖曳標籤到左欄或右欄；已放的可拖回或換欄</p><div class="tc-drag"><div class="tc-dcol" id="tcl"><h4>'+q.labels[0]+'</h4></div><div class="tc-dcol" id="tcr"><h4>'+q.labels[1]+'</h4></div></div><div class="tc-drag" style="border:none"><div class="tc-dcol" id="pool" style="border:2px dashed #a78bfa;min-height:50px"><h4>📦 待分類</h4></div></div><button class="btn btn-s" id="tcc" style="margin-top:8px">✓ 我分好了</button>';
  q.chips.forEach((c,i)=>{const el=document.createElement('div');el.className='drag-chip';el.draggable=true;el.dataset.idx=i;el.textContent=c;el.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',i);this.classList.add('dragging');});el.addEventListener('dragend',function(){this.classList.remove('dragging');});$('pool').appendChild(el);});
  ['tcl','tcr','pool'].forEach(id=>{const zone=$(id);zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});zone.addEventListener('dragleave',()=>{zone.classList.remove('drag-over');});zone.addEventListener('drop',function(e){e.preventDefault();this.classList.remove('drag-over');const idx=e.dataTransfer.getData('text/plain');const el=document.querySelector('.drag-chip[data-idx="'+idx+'"]');if(el)this.appendChild(el);});});
  $('tcc').addEventListener('click',()=>{const placed=document.querySelectorAll('.drag-chip').length-document.querySelectorAll('#pool .drag-chip').length;if(placed!==q.chips.length){$('fb').textContent='還有標籤在待分類區！';$('fb').className='fb ng';return;}let ok=true;q.ans.left.forEach(ch=>{if(!Array.from($('tcl').querySelectorAll('.drag-chip')).map(e=>e.textContent).includes(ch))ok=false;});q.ans.right.forEach(ch=>{if(!Array.from($('tcr').querySelectorAll('.drag-chip')).map(e=>e.textContent).includes(ch))ok=false;});if(ok)win(q.pts,q.x);else lose(q.x,q.hint,()=>{buildTC(q);},true);});
}
function showResult(){$('rn').textContent=pN;$('rs').textContent=sc+' 分';$('rc').textContent=co+' / '+TOTAL+' 關';
  let h='<h3>📊 各主題表現</h3>';const days=['Day1','Day3','Day4','Day5','Day6','Day7','Day8','Day9'];
  days.forEach(d=>{const w=wrongCount[d]||0;const t2=2;const c2=t2-w;const p=Math.round(c2/t2*100);const cls=p>=80?'dg':p>=50?'dy':'dr';const em=p>=80?'✅':p>=50?'⚠️':'❌';h+='<div class="diag-bar"><span class="diag-label">'+d+'</span><div class="diag-track"><div class="diag-fill '+cls+'" style="width:'+Math.max(p,12)+'%"></div></div><span class="diag-pct">'+em+' '+p+'%</span></div>';});$('diag').innerHTML=h;show('se');}
$('br').addEventListener('click',()=>{show('ss');ni.focus();});
</script>
</body>
</html>
