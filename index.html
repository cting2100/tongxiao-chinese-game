<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>銅小國語補救教學 — 綜合測驗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center}
.ct{width:95vw;max-width:820px;background:rgba(255,255,255,.94);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:20px 16px;text-align:center}
.scr{display:none}.scr.on{display:block;animation:fi .35s}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:1.5em;color:#1a1a2e;margin-bottom:4px}h2{font-size:1.1em;color:#5b3a8c;margin-bottom:6px}
.btn{display:inline-block;padding:9px 22px;border:none;border-radius:10px;font-size:.95em;font-weight:bold;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.btn-p{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff}.btn-s{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}.btn-w{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.btn-lg{padding:11px 32px;font-size:1.15em}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.inp{margin:10px 0}.inp label{display:block;font-size:.9em;color:#2d1b69;font-weight:bold;margin-bottom:4px}
.inp input{width:100%;max-width:260px;padding:9px 12px;border:3px solid #d4c8f0;border-radius:10px;font-size:1em;text-align:center;outline:none}.inp input:focus{border-color:#7c5ce7}
.pbar{background:#e8e0f5;height:7px;border-radius:4px;margin:6px 0;overflow:hidden}.pbar-f{background:linear-gradient(90deg,#7c5ce7,#a855f7);height:100%;border-radius:4px;transition:width .5s;width:0%}
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:4px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:12px;font-size:.75em;font-weight:bold}
.bs{background:#7c5ce7;color:#fff}.bg2{background:#f3effa;color:#5b3a8c}
.fb{margin:4px 0;min-height:18px;font-size:.9em;font-weight:bold}.fb.ok{color:#059669}.fb.ng{color:#dc2626}
.explain{background:#f0fdf4;border-left:3px solid #10b981;padding:8px 12px;border-radius:0 8px 8px 0;margin:4px 0;font-size:.82em;text-align:left;line-height:1.5;color:#065f46;display:none}

/* 部首歸類新設計：全部生字一起放，拖到三個部首區 */
.rad-game{padding:8px;margin:4px 0}
.rad-chars{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;min-height:44px}
.rad-ch{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:#fff;border:2px solid #c4b5fd;border-radius:10px;font-size:1.1em;font-weight:bold;cursor:pointer;color:#2d1b69;transition:all .2s;user-select:none}
.rad-ch:hover{background:#ede9fe;border-color:#7c5ce7;transform:scale(1.1)}
.rad-ch.sel{background:#7c5ce7;color:#fff;border-color:#7c5ce7;transform:scale(1.15)}
.rad-ch.placed{background:#d1fae5;border-color:#10b981;color:#065f46;cursor:default;pointer-events:none}
.rad-zones{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rad-zone{flex:1;min-width:120px;max-width:220px;min-height:80px;border:3px dashed #c4b5fd;border-radius:12px;padding:6px;background:#faf8ff;transition:all .2s;display:flex;flex-direction:column;align-items:center}
.rad-zone h4{font-size:.82em;color:#6d28d9;margin-bottom:4px}
.rad-zone:hover{border-color:#a78bfa}
.rad-zone .z-chars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.rad-zone .z-chars .rad-ch{width:40px;height:40px;font-size:1em;cursor:default;pointer-events:none}

/* 轉折配對全自由 */
.pair-game{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.pair-col{display:flex;flex-direction:column;gap:5px;min-width:140px}
.pair-card{padding:8px 12px;background:#fff;border:2px solid #d1d4fa;border-radius:8px;font-size:.85em;cursor:pointer;transition:all .2s;text-align:center}
.pair-card:hover{border-color:#a78bfa}.pair-card.sel{border-color:#7c5ce7;background:#ede9fe;transform:scale(1.03)}
.pair-card.ok{background:#d1fae5;border-color:#10b981;cursor:default}

/* 排序 */
.sort-i{padding:9px 12px;background:#fff;border:2px solid #d1d4fa;border-radius:8px;cursor:pointer;font-size:.85em;text-align:left;margin:3px 0;transition:all .2s;color:#2d1b69}
.sort-i:hover{border-color:#a78bfa}.sort-i.done{background:#dbeafe;border-color:#60a5fa;cursor:default;opacity:.6}
.sort-res{display:flex;gap:4px;flex-wrap:wrap;min-height:30px;margin:4px 0}
.sort-chip{padding:4px 8px;background:#dbeafe;border:1px solid #60a5fa;border-radius:6px;font-size:.78em;color:#1e40af}
.sort-chip.bad{background:#fee2e2;border-color:#ef4444;color:#991b1b}

/* 填空 */
.fill-p{font-size:.9em;line-height:1.8;text-align:left;margin:6px 0;color:#2d1b69}
.fill-gap{display:inline-block;width:40px;text-align:center;border-bottom:2px dashed #f59e0b;margin:0 3px;cursor:pointer;font-size:1.2em;font-weight:bold;color:#d97706;transition:all .2s}
.fill-gap:hover{background:#fef3c7}.fill-gap.done{background:#d1fae5;border-color:#10b981;color:#065f46}
.ppal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.pp{padding:8px 14px;background:#fff;border:2px solid #fbbf24;border-radius:8px;cursor:pointer;font-size:1.1em;transition:all .2s}
.pp:hover{background:#fef3c7}.pp.u{background:#e8e0f5;border-color:#c4b5fd;cursor:default;opacity:.5}

/* T圖 */
.tchart{display:flex;gap:4px;margin:8px 0;justify-content:center}
.tc-col{flex:1;border:2px solid #c4b5fd;border-radius:8px;padding:8px;min-height:100px}.tc-col h4{font-size:.8em;color:#6d28d9;margin-bottom:4px}
.tc-pool{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:4px 0}
.tc-chip{padding:5px 10px;background:#fff;border:2px solid #a78bfa;border-radius:6px;font-size:.78em;cursor:pointer;transition:all .2s}
.tc-chip:hover{background:#ede9fe}.tc-chip.done{background:#d1fae5;border-color:#10b981;cursor:default}

/* 結果 */
.stats{margin:8px auto;max-width:400px}.sr{display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid #e8e0f5;font-size:.9em}.sr:last-child{border-bottom:none}.sl{color:#7c6ba0}.sv{color:#2d1b69;font-weight:bold}
.diag-box{background:#fafafa;border:2px solid #e8e0f5;border-radius:10px;padding:10px;margin:8px auto;max-width:460px}.diag-box h3{color:#5b3a8c;font-size:.85em;margin-bottom:5px}
.diag-bar{margin:4px 0;display:flex;align-items:center;gap:5px}.diag-label{width:70px;text-align:right;font-size:.75em;color:#5b3a8c;font-weight:bold}
.diag-track{flex:1;height:14px;background:#e8e0f5;border-radius:7px;overflow:hidden}.diag-fill{height:100%;border-radius:7px;transition:width 1s}.dg{background:linear-gradient(90deg,#10b981,#34d399)}.dy{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.dr{background:linear-gradient(90deg,#ef4444,#f87171)}.diag-pct{width:34px;font-size:.7em;color:#7c6ba0}

.hint-box{background:#fff7ed;border:2px solid #fbbf24;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:.8em;text-align:left;color:#92400e;display:none}
.hint-box b{color:#d97706}

@media(max-width:480px){.ct{padding:10px 6px}h1{font-size:1.2em}.rad-zone{min-width:90px}}
</style>
</head>
<body><div class="ct">

<div class="scr on" id="ss">
  <div style="font-size:2.8em">🏫</div>
  <h1>銅小國語補救教學綜合測驗</h1>
  <h2>共 18 題 · 作答後若錯誤才顯示提示</h2>
  <div class="inp"><label for="ni">請輸入你的名字：</label><input type="text" id="ni" placeholder="例如：小明" maxlength="20" autocomplete="off"></div>
  <button class="btn btn-p btn-lg" id="bg" disabled>開始作答 ▶</button>
</div>

<div class="scr" id="sg">
  <div class="gtop"><span class="badge bs" id="sn"></span><span class="badge bg2">⭐ <span id="cs">0</span> 分</span><span class="badge bg2">📝 <span id="qp">1/18</span></span></div>
  <div class="pbar"><div class="pbar-f" id="pb"></div></div>
  <div id="gz"></div>
  <div class="hint-box" id="hb"></div>
  <div class="fb" id="fb"></div><div class="explain" id="ex"></div>
  <button class="btn btn-p" id="bn" style="display:none">下一題 ▶</button>
</div>

<div class="scr" id="se">
  <div style="font-size:2.8em">🏆</div><h1>測驗完成！</h1>
  <div class="stats"><div class="sr"><span class="sl">玩家</span><span class="sv" id="rn"></span></div><div class="sr"><span class="sl">總分</span><span class="sv" id="rs"></span></div><div class="sr"><span class="sl">答對</span><span class="sv" id="rc"></span></div></div>
  <div class="diag-box" id="diag"></div>
  <button class="btn btn-w btn-lg" id="br" style="margin-top:8px">再測一次 🔄</button>
</div>

</div>
<script>
const $=id=>document.getElementById(id);

// ═══ 題庫（Day1-9，無預先提示，答錯才顯示策略鷹架）═══
const ALL=[
{day:'Day1 文本閱讀',type:'sort',title:'📖 颱風天 — 時間順序排列',items:['今天一早，窗外風很大，雨一直下','昨天晚上，媽媽說颱風要來了','晚上，颱風慢慢離開，風雨變小了','下午，風雨更大了，還停電了','隔天早上，天氣放晴了'],ans:[1,0,3,2,4],x:'時間順序：昨天晚上→今天一早→下午→晚上→隔天早上。記住策略口訣：「先做什麼？再做什麼？畫箭頭就知道！」',hint:'💡 提示：先找出每個句子裡的時間詞（昨天晚上、今天一早、下午、晚上、隔天早上），再按照時間的先後順序排列。',pts:25},
{day:'Day1 文本閱讀',type:'choice',title:'📖 勇敢的小烏龜 — 理解題',q:'小烏龜最後學到了什麼道理？',o:['石頭很危險，不要隨便爬','只要有信心，什麼都不用學','勇敢嘗試，可以看到不一樣的世界','小鳥不應該多管閒事'],a:2,x:'小烏龜從膽小變勇敢，牠試了之後發現「原來勇敢一點，就可以看到不一樣的世界」！',hint:'💡 提示：小烏龜一開始很膽小，後來爬上了石頭看到了風景。故事最後牠說了什麼話？那句話就是答案。',pts:20},
{day:'Day2 部首',type:'radical',title:'🔍 部首歸類 — 把生字放到正確的部首',chars:['吃','唱','喝','打','拍','拉','跑','跳','踢'],zones:[{name:'口部（嘴巴）',ans:['吃','唱','喝']},{name:'扌部（手）',ans:['打','拍','拉']},{name:'足部（腳）',ans:['跑','跳','踢']}],x:'口部跟嘴巴有關（吃、唱、喝）；扌部跟手有關（打、拍、拉）；足部跟腳有關（跑、跳、踢）。',hint:'💡 提示：先看每個字的部首在哪裡——「口」在左邊跟嘴巴有關、「扌」在左邊跟手有關、「足」在左邊跟腳有關。試著做做看動作：吃東西用什麼？打鼓用什麼？跑步用什麼？',pts:25},
{day:'Day2 部首',type:'radical',title:'🔍 部首歸類 — 火部字三類',chars:['熱','燒','炒','煮','烤','燈','煙'],zones:[{name:'🔥 溫度感覺',ans:['熱']},{name:'🔥 加熱動作',ans:['燒','炒','煮','烤']},{name:'🔥 火相關物',ans:['燈','煙']}],x:'火部可以再細分：溫度感覺（熱）、加熱動作（燒炒煮烤）、火相關物（燈煙）。口訣：「火燒成四點（灬），分類更清楚！」',hint:'💡 提示：「熱」是一種感覺，不是動作；「燒炒煮烤」都是要用火去做某件事（動作）；「燈」和「煙」是跟火有關的東西。',pts:25},
{day:'Day3 心部水部',type:'radical',title:'💧 部首歸類 — 水部 vs 心部',chars:['海','洗','淚','想','怕','急','忘'],zones:[{name:'氵部（水）',ans:['海','洗','淚']},{name:'心部（心情）',ans:['想','怕','急','忘']}],x:'氵（三點水）的字跟水有關；心部的字跟心情/感覺有關。口訣：「看得到的水（氵），看不到的心（心）！」',hint:'💡 提示：三點水「氵」是水的變形，這些字跟水有關（海水、洗手、眼淚）；心部的字在底部或中間有「心」，這些字跟心情感覺有關（想、怕、急、忘）。',pts:25},
{day:'Day3 心部水部',type:'choice',title:'💧 四字詞結構',q:'「朵朵白雲」是哪一種結構？',o:['AAB型（疊字在前）','數字型（數字+名詞）','ABCC型（疊字在後）','沒有規律'],a:0,x:'「朵朵白雲」= 朵(疊)+朵(疊)+白+雲 → AAB型。像「小小世界」也是！策略：拆→看→歸納。',hint:'💡 提示：把「朵朵白雲」拆開來看：朵、朵、白、雲。前面兩個字「朵朵」是一樣的（疊字），後面是名詞。這種叫AAB型。',pts:20},
{day:'Day4 句型時間',type:'sort',title:'⏰ 做早餐 — 步驟排序',items:['從冰箱拿出吐司和蛋','把吐司放進烤箱烤','把蛋打入鍋子裡煎','坐下來享用美味的早餐'],ans:[0,1,2,3],x:'正確順序：拿材料→烤吐司→煎蛋→享用。時間順序策略口訣：「時間畫箭頭，先做什麼？再做什麼？」',hint:'💡 提示：做早餐要先準備材料，然後才能開始煮。吐司和蛋都準備好之後，先烤吐司（要等比較久），再煎蛋，最後才能坐下來吃。',pts:25},
{day:'Day4 句型時間',type:'fill',title:'⏰ 順序詞填空',text:'____，從冰箱拿出吐司和蛋。____，把吐司放進烤箱烤。____，把蛋打入鍋子裡煎。____，坐下來享用美味的早餐！',blanks:['＿＿＿＿','＿＿＿＿','＿＿＿＿','＿＿＿＿'],choices:['首先','接著','然後','最後'],ans:['首先','接著','然後','最後'],x:'「首先→接著→然後→最後」是基本時間順序詞！記住這個公式。',hint:'💡 提示：時間順序詞有固定的用法——一開始用「首先」，接下來用「接著」，再來用「然後」，結尾用「最後」。',pts:20},
{day:'Day5 轉折',type:'pair',title:'🔄 轉折詞連連看',left:['小明很想出去玩','這個包包很漂亮','他個子很小','我已經很累了'],right:['但是外面下大雨，不能出去','可是價錢太貴了，買不起','但是力氣非常大','卻還是把功課寫完了'],ans:[0,1,2,3],x:'轉折詞（但是、可是、卻）後面才是重點！策略口訣：「轉折詞像路標，重點在後半！」',hint:'💡 提示：先讀前半句的意思，再想後半句應該接什麼意思相反的句子。例如「很想出去玩」→結果「不能出去」才是轉折。前後意思要相反！',pts:25},
{day:'Day5 轉折',type:'choice',title:'🔄 轉折 vs 因果',q:'「因為下雨了，所以我帶雨傘。」這是什麼句型？',o:['轉折句（前後相反）','因果句（前因後果）','並列句（兩件事並排）','條件句'],a:1,x:'下雨（原因）→帶雨傘（結果），這是因果句。轉折句是「雖然…但是…」前後相反，不要搞混！',hint:'💡 提示：因果有「因為…所以…」，前面是原因後面是結果。轉折有「雖然…但是…」，前後意思會不一樣。這題有「因為…所以…」所以是因果。',pts:20},
{day:'Day6 轉折進階',type:'choice',title:'🧭 無轉折詞找轉折',q:'「說好要去公園玩。下雨了，不能去了。」這兩句之間少了哪個轉折詞？',o:['因為','所以','但是','首先'],a:2,x:'沒有「但是」，但意思轉彎了！本來要去→下雨不能去。這就是隱藏的轉折。策略：轉折偵探！',hint:'💡 提示：前面說「要去」，後面說「不能去」——意思相反！雖然沒寫出來，但中間應該放一個讓意思轉彎的詞。哪個詞是用來轉彎的？',pts:20},
{day:'Day6 轉折進階',type:'choice',title:'🧭 多重轉折追蹤',q:'小明想學鋼琴，但是家裡沒有鋼琴。他沒有放棄，每天去學校音樂教室練習。然而有一天音樂教室關門了。不過老師看到他的努力，借給他教室鑰匙。最後小明學會了彈鋼琴。\n\n總共發生了幾次轉折？',o:['1次','2次','3次','沒有轉折'],a:2,x:'三次轉折：(1)想學但沒鋼琴→(2)練習但教室關→(3)關了但老師借鑰匙。策略：追蹤每個「但是、然而、不過」！',hint:'💡 提示：圈出文中的轉折詞——「但是」、「然而」、「不過」各算一次轉折。仔細找找看有幾個？',pts:25},
{day:'Day7 標點故事',type:'fill',title:'✏️ 標點符號填空',text:'今天天氣真好□萬里無雲□微風輕輕吹來□你喜歡這樣的天氣嗎□太棒了□我們一起去公園玩吧□',blanks:['□','□','□','□','□','□'],choices:['。','，','？','！'],ans:['。','，','。','？','！','！'],x:'句號（。）→一句話說完；逗號（，）→還沒說完換氣；問號（？）→問問題；驚嘆號（！）→大聲或開心。策略：肢體動作記憶！',hint:'💡 提示：敘述句用句號（。）；句子中間用逗號（，）；問句用問號（？）；表達開心或大聲用驚嘆號（！）。最後一句「太棒了」和「去玩吧」都是開心的語氣！',pts:25},
{day:'Day7 標點故事',type:'sort',title:'✏️ 故事山四階段排序',items:['比賽開始，小明是第一棒（開始）','順利交棒給第二棒小華（經過）','最後一棒衝向終點，全班歡呼（高潮）','雖然沒得第一，但全班都很開心（結果）'],ans:[0,1,2,3],x:'故事山：開始（起跑）→經過（交棒）→高潮（衝終點）→結果（結局）。口訣：「故事三兄弟，爬山有意思！」',hint:'💡 提示：故事像爬山！一開始在山腳（開始），往上爬（經過），爬到最高最刺激（高潮），最後下山回家了（結果）。「衝向終點歡呼」最刺激，是山頂！',pts:25},
{day:'Day8 童話',type:'choice',title:'📚 小蜜蜂與大象 — 童話 5 元素',q:'故事中，大象遇到的「問題」是什麼？',o:['大象不喜歡花園','大象的鼻子卡在樹洞裡','小蜜蜂不願意幫忙','大象想要吃蜂蜜'],a:1,x:'問題=大象鼻子卡住。解決=蜜蜂用尾針刺鼻子→打噴嚏→鼻子滑出來。結局=大象變友善。記住5元素：角色、場景、問題、解決、結局。',hint:'💡 提示：童話中的「問題」就是主角遇到的麻煩！大象遇到什麼麻煩了？故事中說他的鼻子怎麼了？',pts:20},
{day:'Day8 童話',type:'choice',title:'📚 兩隻小羊 — 找證據',q:'兩隻小羊最後為什麼都順利過橋了？',o:['其中一隻放棄過橋了','黑羊先退到岸邊讓白羊過，然後自己再過','牠們找了另一座橋','橋突然變寬了'],a:1,x:'從文章找證據：「黑羊先退到岸邊讓白羊過，然後黑羊再過橋」。策略口訣：「不是亂猜，要有證據！」',hint:'💡 提示：回到故事中找答案！故事告訴我們兩隻羊最後怎麼做的——誰先退讓了？退讓之後發生了什麼事？',pts:20},
{day:'Day9 說明文',type:'tchart',title:'📋 仙人掌 T 圖表',labels:['結構（長什麼樣子）','功能（有什麼用處）'],chips:['粗厚的莖','儲存水分','針狀的葉子','減少水分蒸發','淺而廣的根','可以快速吸收雨水'],ans:{left:['粗厚的莖','針狀的葉子','淺而廣的根'],right:['儲存水分','減少水分蒸發','可以快速吸收雨水']},x:'修人掌為了沙漠生存演化出儲水構造！口訣：「左邊寫外表，右邊寫功能。左是長怎樣，右是做什麼！」',hint:'💡 提示：T圖表左邊放「長什麼樣子」的外觀描述（莖、葉子、根）；右邊放「能做什麼」的功能（儲水、減少蒸發、吸水）。自問：這是描述外表？還是說明用途？',pts:30},
{day:'Day9 說明文',type:'choice',title:'📋 因果關係',q:'「因為沙漠缺水，所以仙人掌的莖可以儲存水分。」哪個是因？哪個是果？',o:['因：沙漠缺水／果：莖可儲水','因：莖可儲水／果：沙漠缺水','兩個都是因','兩個都是果'],a:0,x:'因為→沙漠缺水（原因）；所以→莖儲水（結果）。策略口訣：「有因果，用因為所以！因在前果在後。」',hint:'💡 提示：「因為」後面接的是原因（為什麼會這樣），「所以」後面接的是結果（發生了什麼事）。仔細看句子中哪個在「因為」後面？',pts:20}
];
const TOTAL=ALL.length;
let pN='',qi=0,sc=0,co=0,wrongCount={};
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}

// ═══ 開始 ═══
const ni=$('ni'),bg=$('bg');
ni.addEventListener('input',()=>{bg.disabled=ni.value.trim().length<1});
ni.addEventListener('keydown',e=>{if(e.key==='Enter'&&!bg.disabled)start()});
bg.addEventListener('click',start);
function start(){pN=ni.value.trim();if(!pN)return;qi=0;sc=0;co=0;wrongCount={};$('cs').textContent='0';$('pb').style.width='0%';run();}

// ═══ 主流程 ═══
function run(){
  if(qi>=TOTAL){showResult();return;}
  const q=ALL[qi];$('sn').textContent=q.day;$('cs').textContent=sc;$('qp').textContent=(qi+1)+'/'+TOTAL;$('fb').textContent='';$('fb').className='fb';$('ex').style.display='none';$('hb').style.display='none';$('bn').style.display='none';
  $('gz').innerHTML='';
  if(q.type==='radical')buildRad(q);else if(q.type==='sort')buildSort(q);else if(q.type==='pair')buildPair(q);else if(q.type==='fill')buildFill(q);else if(q.type==='tchart')buildTC(q);else buildChoice(q);
  show('sg');$('pb').style.width=(qi/TOTAL*100)+'%';
}
function win(pts,x){sc+=pts;co++;$('cs').textContent=sc;$('fb').textContent='✅ 答對了！（+'+pts+' 分）';$('fb').className='fb ok';$('ex').textContent='💡 '+x;$('ex').style.display='block';$('bn').style.display='inline-block';$('bn').textContent='下一題 ▶';$('hb').style.display='none';}
function lose(x,hint){$('fb').textContent='❌ 不對喔，看看提示再想一想！';$('fb').className='fb ng';
  $('hb').innerHTML=hint;$('hb').style.display='block';
  $('ex').textContent='💡 '+x;$('ex').style.display='block';
  $('bn').style.display='inline-block';$('bn').textContent='下一題 ▶';
  if(!wrongCount[ALL[qi].day])wrongCount[ALL[qi].day]=0;wrongCount[ALL[qi].day]++;
}
$('bn').addEventListener('click',()=>{qi++;run();});

// ═══ 選擇題 ═══
function buildChoice(q){$('gz').innerHTML='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:6px">'+q.title+'</h2><p style="font-size:.9em;color:#1e1040;margin-bottom:8px;white-space:pre-line">'+q.q+'</p>';const od=document.createElement('div');od.style.cssText='display:flex;flex-direction:column;gap:5px';const lb=['A','B','C','D'];q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='btn';b.style.cssText='text-align:left;background:#fff;border:2px solid #e8e0f5;padding:10px 14px;border-radius:8px;width:100%;font-family:inherit;font-size:.9em;cursor:pointer;color:#2d1b69';b.textContent=lb[i]+'. '+o;b.addEventListener('click',()=>{od.querySelectorAll('button').forEach(bb=>bb.disabled=true);if(i===q.a){b.style.borderColor='#10b981';b.style.background='#d1fae5';win(q.pts,q.x)}else{b.style.borderColor='#ef4444';b.style.background='#fee2e2';od.querySelectorAll('button')[q.a].style.borderColor='#10b981';od.querySelectorAll('button')[q.a].style.background='#d1fae5';lose(q.x,q.hint)}});od.appendChild(b);});$('gz').appendChild(od);}

// ═══ 部首歸類（全部生字一次呈現，點選後放入對應部首區）═══
let rSel=null;
function buildRad(q){
  let h='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:6px">'+q.title+'</h2><div class="rad-game"><div class="rad-chars" id="rchars">';
  const all=q.chars.slice().sort(()=>Math.random()-.5);
  all.forEach(c=>{h+='<div class="rad-ch" data-c="'+c+'">'+c+'</div>';});
  h+='</div><div class="rad-zones">';
  q.zones.forEach(z=>{h+='<div class="rad-zone" data-zone="'+z.name+'"><h4>'+z.name+'</h4><div class="z-chars"></div></div>';});
  h+='</div></div>';$('gz').innerHTML=h;
  document.querySelectorAll('.rad-ch').forEach(ch=>ch.addEventListener('click',function(){
    if(this.classList.contains('placed'))return;
    document.querySelectorAll('.rad-ch').forEach(c=>c.classList.remove('sel'));this.classList.add('sel');rSel=this;
  }));
  document.querySelectorAll('.rad-zone').forEach(z=>z.addEventListener('click',function(){
    if(!rSel)return;$('fb').textContent='';$('fb').className='fb';
    const ch=rSel.dataset.c;const zn=this.dataset.zone;const zq=q.zones.find(z=>z.name===zn);
    rSel.classList.remove('sel');rSel.classList.add('placed');
    const zc=this.querySelector('.z-chars');const el=document.createElement('div');el.className='rad-ch placed';el.textContent=ch;el.style.cssText='width:40px;height:40px;font-size:1em';zc.appendChild(el);
    rSel=null;
    // 檢查是否全部分完
    const placed=document.querySelectorAll('.rad-ch.placed').length;
    if(placed===q.chars.length){
      // 驗證
      let allCorrect=true;
      document.querySelectorAll('.rad-zone').forEach(zone=>{
        const zname=zone.dataset.zone;const zq2=q.zones.find(z=>z.name===zname);
        const charsInZone=Array.from(zone.querySelectorAll('.rad-ch.placed, .z-chars .rad-ch')).map(el=>el.textContent||el.dataset.c);
        charsInZone.forEach(c=>{if(!zq2.ans.includes(c))allCorrect=false;});
      });
      if(allCorrect)win(q.pts,q.x);else lose(q.x,q.hint);
    }
  }));
}

// ═══ 排序 ═══
let sO=[];
function buildSort(q){sO=[];let h='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:6px">'+q.title+'</h2><div class="sort-res"><span style="color:#9c8cb5;font-size:.8em">已排：</span></div><div>';q.items.forEach((it,i)=>{h+='<div class="sort-i" data-idx="'+i+'">'+it+'</div>';});h+='</div>';$('gz').innerHTML=h;
  document.querySelectorAll('.sort-i').forEach(el=>el.addEventListener('click',function(){const idx=parseInt(this.dataset.idx);if(sO.includes(idx))return;sO.push(idx);this.classList.add('done');const res=document.querySelector('.sort-res');let rh='<span style="color:#9c8cb5;font-size:.8em">已排：</span>';sO.forEach(i=>{rh+='<span class="sort-chip">'+q.items[i]+'</span>';});res.innerHTML=rh;if(sO.length===q.items.length){if(JSON.stringify(sO)===JSON.stringify(q.ans))win(q.pts,q.x);else{rh='';sO.forEach(i=>{rh+='<span class="sort-chip bad">'+q.items[i]+'</span>';});res.innerHTML='<span style="color:#9c8cb5;font-size:.8em">你的答案：</span>'+rh;lose(q.x,q.hint)}}}));
}

// ═══ 轉折配對 ═══
let pS=null,pM=0;
function buildPair(q){pS=null;pM=0;let h='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:6px">'+q.title+'</h2><div class="pair-game"><div class="pair-col">';q.left.forEach((l,i)=>{h+='<div class="pair-card" data-side="left" data-idx="'+i+'">'+l+'</div>';});h+='</div><div class="pair-col">';q.right.map((r,i)=>({r,i})).sort(()=>Math.random()-.5).forEach(r=>{h+='<div class="pair-card" data-side="right" data-idx="'+r.i+'">'+r.r+'</div>';});h+='</div></div>';$('gz').innerHTML=h;
  document.querySelectorAll('.pair-card').forEach(c=>c.addEventListener('click',function(){
    if(this.classList.contains('ok'))return;
    if(!pS){document.querySelectorAll('.pair-card').forEach(cc=>cc.classList.remove('sel'));this.classList.add('sel');pS=this;}
    else if(pS.dataset.side===this.dataset.side){document.querySelectorAll('.pair-card').forEach(cc=>cc.classList.remove('sel'));this.classList.add('sel');pS=this;}
    else{const li=parseInt(pS.dataset.side==='left'?pS.dataset.idx:this.dataset.idx);const ri=parseInt(pS.dataset.side==='right'?pS.dataset.idx:this.dataset.idx);if(q.ans[li]===ri){pS.classList.add('ok');this.classList.add('ok');pS.classList.remove('sel');this.classList.remove('sel');pM++;if(pM===q.left.length)win(q.pts,q.x);}else{const leftCard=document.querySelector('.pair-card[data-side="left"][data-idx="'+li+'"]');pS.classList.remove('sel');this.classList.remove('sel');setTimeout(()=>{if(!leftCard.classList.contains('ok'))leftCard.style.borderColor='#ef4444';this.style.borderColor='#ef4444';setTimeout(()=>{leftCard.style.borderColor='#d1d4fa';this.style.borderColor='#d1d4fa';},500);},0);}pS=null;}
  }));
  // 檢查按鈕
  const checkBtn=document.createElement('button');checkBtn.className='btn btn-s';checkBtn.textContent='✓ 我配好了';checkBtn.style.marginTop='8px';checkBtn.addEventListener('click',()=>{
    let allOk=true;document.querySelectorAll('.pair-card[data-side="left"]').forEach(c=>{if(!c.classList.contains('ok'))allOk=false;});
    if(!allOk){$('fb').textContent='還有沒配對的，請全部配完再檢查！';$('fb').className='fb ng';return;}
    const matched=document.querySelectorAll('.pair-card.ok').length===q.left.length*2;
    if(matched&&pM===q.left.length)win(q.pts,q.x);else lose(q.x,q.hint);
  });$('gz').appendChild(checkBtn);
}

// ═══ 填空 ═══
let fB=[];
function buildFill(q){fB=[];$('gz').innerHTML='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:6px">'+q.title+'</h2><div class="fill-p" id="fp"></div><div class="ppal" id="ppal"></div>';const fp=$('fp');let th=q.text;q.blanks.forEach((b,i)=>{th=th.replace(b,'<span class="fill-gap" data-idx="'+i+'">□</span>');});fp.innerHTML=th;q.choices.forEach(ch=>{const b=document.createElement('div');b.className='pp';b.textContent=ch;b.addEventListener('click',()=>{const g=document.querySelectorAll('.fill-gap:not(.done)');if(g.length===0)return;const gap=g[0];const idx=parseInt(gap.dataset.idx);fB[idx]=ch;gap.textContent=ch;gap.classList.add('done');document.querySelectorAll('.pp').forEach(p=>{if(p.textContent===ch)p.classList.add('u');});if(fB.filter(b=>b!==undefined).length===q.blanks.length){if(JSON.stringify(fB.slice(0,q.ans.length))===JSON.stringify(q.ans))win(q.pts,q.x);else lose(q.x,q.hint)}});$('ppal').appendChild(b);});
  document.querySelectorAll('.fill-gap').forEach(g=>g.addEventListener('click',function(){const idx=parseInt(this.dataset.idx);if(fB[idx]!==undefined){const old=fB[idx];fB[idx]=undefined;this.textContent='□';this.classList.remove('done');document.querySelectorAll('.pp').forEach(p=>{let c=0;document.querySelectorAll('.fill-gap.done').forEach(dg=>{if(dg.textContent===p.textContent)c++;});if(p.textContent===old&&c===0)p.classList.remove('u');});}}));
}

// ═══ T圖表 ═══
let tP=[];
function buildTC(q){tP=[];$('gz').innerHTML='<h2 style="color:#2d1b69;font-size:1em;margin-bottom:6px">'+q.title+'</h2><div class="tchart"><div class="tc-col" id="tcl"><h4>📐 '+q.labels[0]+'</h4></div><div class="tc-col" id="tcr"><h4>⚙️ '+q.labels[1]+'</h4></div></div><div class="tc-pool">'+q.chips.map((c,i)=>'<span class="tc-chip" data-idx="'+i+'">'+c+'</span>').join('')+'</div>';
  const checkBtn=document.createElement('button');checkBtn.className='btn btn-s';checkBtn.textContent='✓ 我分好了';checkBtn.style.marginTop='8px';checkBtn.addEventListener('click',()=>{
    if(tP.length!==q.chips.length){$('fb').textContent='還有標籤沒分類，請全部分完再檢查！';$('fb').className='fb ng';return;}
    let allOk=true;q.ans.left.forEach(ch=>{if(!document.querySelector('#tcl .tc-chip.placed')||!Array.from(document.querySelectorAll('#tcl .tc-chip.placed')).map(e=>e.textContent).includes(ch))allOk=false;});q.ans.right.forEach(ch=>{if(!document.querySelector('#tcr .tc-chip.placed')||!Array.from(document.querySelectorAll('#tcr .tc-chip.placed')).map(e=>e.textContent).includes(ch))allOk=false;});
    if(allOk)win(q.pts,q.x);else lose(q.x,q.hint);
  });$('gz').appendChild(checkBtn);
  document.querySelectorAll('.tc-chip').forEach(ch=>ch.addEventListener('click',function(){
    if(this.classList.contains('done'))return;const i=parseInt(this.dataset.idx);const chip=q.chips[i];const isLeft=q.ans.left.includes(chip);const target=isLeft?$('tcl'):$('tcr');target.appendChild(this);this.classList.add('done');tP.push(i);
  }));
}

// ═══ 結果 ═══
function showResult(){$('rn').textContent=pN;$('rs').textContent=sc+' 分';$('rc').textContent=co+' / '+TOTAL+' 題';
  let h='<h3>📊 各日表現</h3>';const days=[{d:'Day1 文本閱讀',t:2},{d:'Day2 部首',t:2},{d:'Day3 心部水部',t:2},{d:'Day4 句型時間',t:2},{d:'Day5 轉折',t:2},{d:'Day6 轉折進階',t:2},{d:'Day7 標點故事',t:2},{d:'Day8 童話',t:2},{d:'Day9 說明文',t:2}];
  days.forEach(({d,t})=>{const wrong=wrongCount[d]||0;const corr=t-wrong;const p=Math.round(corr/t*100);const cls=p>=80?'dg':p>=50?'dy':'dr';const em=p>=80?'✅':p>=50?'⚠️':'❌';h+='<div class="diag-bar"><span class="diag-label">'+d.replace('Day','D')+'</span><div class="diag-track"><div class="diag-fill '+cls+'" style="width:'+Math.max(p,12)+'%"></div></div><span class="diag-pct">'+em+' '+p+'%</span></div>';});
  $('diag').innerHTML=h;show('se');}
$('br').addEventListener('click',()=>{show('ss');ni.focus();});
</script>
