<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>銅小四年級國語補救教學 — 總複習挑戰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{position:relative;z-index:1;width:95vw;max-width:780px;background:rgba(255,255,255,.93);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:24px 20px;text-align:center}
.scr{display:none}.scr.on{display:block;animation:fi .4s}
@keyframes fi{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:1.7em;color:#2d1b69;margin-bottom:4px}
h2{font-size:1.2em;color:#5b3a8c;margin-bottom:10px}
.sub{color:#7c6ba0;font-size:.85em;margin-bottom:8px}
.desc{background:#f3effa;border-radius:12px;padding:12px;margin:10px 0;text-align:left;font-size:.85em;color:#4a3b6b;line-height:1.7}
.inp{margin:14px 0}.inp label{display:block;font-size:1em;color:#2d1b69;font-weight:bold;margin-bottom:5px}
.inp input{width:100%;max-width:300px;padding:10px 16px;border:3px solid #d4c8f0;border-radius:12px;font-size:1.1em;text-align:center;outline:none;transition:border .3s}
.inp input:focus{border-color:#7c5ce7}
.btn{display:inline-block;padding:10px 28px;border:none;border-radius:12px;font-size:1.05em;font-weight:bold;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.btn:active{transform:translateY(0)}
.btn-pri{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff}
.btn-suc{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
.btn-war{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.btn-lg{padding:12px 40px;font-size:1.25em}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* 遊戲中 */
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:4px}
.badge{padding:4px 12px;border-radius:16px;font-size:.8em;font-weight:bold}
.bs{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff}
.bt{background:#f3effa;color:#5b3a8c}
.bt.warn{background:#fef3c7;color:#d97706}
.bt.danger{background:#fee2e2;color:#dc2626;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 進度條 */
.pbar-wrap{background:#e8e0f5;height:10px;border-radius:5px;margin:8px 0;overflow:hidden}
.pbar-fill{background:linear-gradient(90deg,#7c5ce7,#a855f7);height:100%;border-radius:5px;transition:width .5s;width:0%}
.pbar-ch{display:flex;justify-content:space-between;font-size:.7em;color:#9c8cb5;margin-bottom:6px}
.pbar-ch span{width:20px;text-align:center}

/* 跑步小人 */
.runner{display:flex;align-items:center;justify-content:flex-start;height:36px;margin:4px 0;position:relative}
.runner-track{flex:1;height:6px;background:#e8e0f5;border-radius:3px;position:relative;margin:0 8px}
.runner-guy{position:absolute;top:-14px;font-size:26px;transition:left .5s ease;left:0%}
.runner-end{font-size:22px}

.q-area{margin:8px 0}
.q-num{font-size:.75em;color:#9c8cb5;margin-bottom:3px}
.q-text{font-size:1.15em;color:#1e1040;font-weight:bold;background:#f8f6fc;padding:14px;border-radius:12px;line-height:1.6;margin-bottom:8px;text-align:left}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:block;width:100%;padding:12px 16px;border:3px solid #e8e0f5;border-radius:10px;background:#fff;font-size:1em;cursor:pointer;text-align:left;transition:all .2s;font-family:inherit;color:#2d1b69}
.opt:hover{border-color:#a78bfa;background:#faf8ff}
.opt.correct{border-color:#10b981!important;background:#d1fae5!important;color:#065f46!important}
.opt.wrong{border-color:#ef4444!important;background:#fee2e2!important;color:#991b1b!important}
.opt.dis{pointer-events:none;opacity:.7}
.fb{margin:6px 0;min-height:24px;line-height:1.5}
.fb.ok{color:#059669;font-weight:bold}
.fb.ng{color:#dc2626;font-weight:bold}
.explain{background:#f0fdf4;border-left:3px solid #10b981;padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0;font-size:.85em;text-align:left;line-height:1.6;color:#065f46;display:none}

/* AI對話 */
.ai-dialog{background:#fff7ed;border:2px solid #fbbf24;border-radius:12px;padding:14px;margin:8px 0;text-align:left;font-size:.85em;line-height:1.7;color:#92400e}
.ai-dialog .ai-label{color:#d97706;font-weight:bold;margin-bottom:4px}
.ai-loading{color:#9c8cb5;text-align:center;font-style:italic}

/* 結果 */
.stats{margin:10px auto;max-width:420px}
.sr{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #e8e0f5;font-size:1em}
.sr:last-child{border-bottom:none}
.sl{color:#7c6ba0}.sv{color:#2d1b69;font-weight:bold}
.rank{display:inline-block;padding:4px 18px;border-radius:16px;font-size:1.05em;font-weight:bold;margin:8px 0}
.rg{background:#fef3c7;color:#92400e}.rs{background:#e2e8f0;color:#475569}
.rb{background:#fde68a;color:#92400e}.rn{background:#f3effa;color:#5b3a8c}
.saving{color:#7c6ba0;font-size:.8em;margin:4px 0}

/* 診斷圖 */
.diag-box{background:#fafafa;border:2px solid #e8e0f5;border-radius:14px;padding:14px;margin:10px auto;max-width:500px}
.diag-box h3{color:#5b3a8c;font-size:.95em;margin-bottom:8px}
.diag-bar{margin:6px 0;display:flex;align-items:center;gap:8px}
.diag-label{width:80px;text-align:right;font-size:.8em;color:#5b3a8c;font-weight:bold}
.diag-track{flex:1;height:18px;background:#e8e0f5;border-radius:9px;overflow:hidden}
.diag-fill{height:100%;border-radius:9px;transition:width 1s;min-width:30px}
.diag-pct{width:40px;font-size:.75em;color:#7c6ba0;text-align:left}
.df-g{background:linear-gradient(90deg,#10b981,#34d399)}.df-y{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.df-r{background:linear-gradient(90deg,#ef4444,#f87171)}

.lb{margin:10px auto;max-width:500px;text-align:left}
.lb h3{color:#5b3a8c;font-size:.9em;margin-bottom:4px}
.lb-i{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:#f8f6fc;border-radius:8px;margin:2px 0;font-size:.85em}
.lb-n{flex:1;color:#2d1b69;font-weight:bold;padding:0 6px}
.lb-s{color:#7c5ce7;font-weight:bold}

/* AI卡片 */
.ai-card{background:linear-gradient(135deg,#fef9ef,#f0fdf4);border:2px solid #a7f3d0;border-radius:12px;padding:14px;margin:8px auto;max-width:500px;text-align:left;font-size:.85em;line-height:1.7}
.ai-card h3{color:#059669;font-size:.95em;margin-bottom:6px}

@media(max-width:480px){
  .container{padding:14px 10px}
  h1{font-size:1.3em}
  .q-text{font-size:1em;padding:10px}
  .opt{font-size:.9em;padding:10px 12px}
  .diag-label{width:60px;font-size:.7em}
}
</style>
</head>
<body>

<div class="container">

<!-- ═══════════ 開始 ═══════════ -->
<div class="scr on" id="scrStart">
  <div style="font-size:3.5em">🏆</div>
  <h1>國語補救教學總複習</h1>
  <h2>20 題綜合挑戰（適合學扶學生）</h2>
  <div class="desc">
    <p><b>說明：</b>每題 <b>40 秒</b>，答對有詳解與鼓勵，答錯有 AI 引導</p>
    <p>題目取自 110-114 年學力檢測，經過調整適合補救教學</p>
  </div>
  <div class="inp">
    <label for="ni">請輸入你的名字：</label>
    <input type="text" id="ni" placeholder="例如：小明" maxlength="20" autocomplete="off">
  </div>
  <button class="btn btn-pri btn-lg" id="bg" disabled>開始挑戰 ▶</button>
</div>

<!-- ═══════════ 遊戲中 ═══════════ -->
<div class="scr" id="scrGame">
  <div class="gtop">
    <span class="badge bs">總複習</span>
    <span class="badge bt">⭐ <span id="cs">0</span> 分</span>
    <span class="badge bt" id="tb">⏱ <span id="td">40</span>s</span>
  </div>
  <div class="pbar-ch" id="pmarkers"></div>
  <div class="pbar-wrap"><div class="pbar-fill" id="pbar"></div></div>
  <div class="runner">
    <span>🏠</span>
    <div class="runner-track"><span class="runner-guy" id="rguy">🏃</span></div>
    <span class="runner-end">🏁</span>
  </div>
  <div class="q-area">
    <div class="q-num" id="qn"></div>
    <div class="q-text" id="qt"></div>
    <div class="opts" id="ob"></div>
    <div class="fb" id="fb"></div>
    <div class="explain" id="ex"></div>
    <div class="ai-dialog" id="aiDlg" style="display:none"></div>
  </div>
  <button class="btn btn-pri" id="bn" style="display:none">下一題 ▶</button>
</div>

<!-- ═══════════ 結果 ═══════════ -->
<div class="scr" id="scrResult">
  <div style="font-size:3.5em">🏅</div>
  <h1>挑戰完成！</h1>
  <div id="rr"></div>
  <div class="stats">
    <div class="sr"><span class="sl">玩家</span><span class="sv" id="rn"></span></div>
    <div class="sr"><span class="sl">總分</span><span class="sv" id="rs"></span></div>
    <div class="sr"><span class="sl">答對</span><span class="sv" id="rc"></span></div>
    <div class="sr"><span class="sl">時間</span><span class="sv" id="rt"></span></div>
  </div>
  <div class="diag-box" id="diag"></div>
  <div class="ai-card" id="aic" style="display:none"></div>
  <div class="saving" id="ss"></div>
  <div class="lb" id="lb"></div>
  <button class="btn btn-war btn-lg" id="br" style="margin-top:8px">再玩一次 🔄</button>
</div>

</div>

// cat: 讀音/形近字/詞語解釋/句型/標點/修辭/閱讀
const Q=[
{c:'讀音',q:'下列哪一個選項「」中的讀音相同？',o:['「輪」番上陣／天「倫」之樂','誤信「偏」方／走「遍」天下','一「波」三折／「坡」度陡峭','一「躍」而起／光宗「耀」祖'],a:0,

{c:'讀音',q:'下列哪一個選項「」中的讀音相同？',o:['貓咪「憐」惜／隔壁「鄰」居','正在「籌」備婚禮／長「壽」動物','花已枯「萎」／眼中有「委」屈','書已出「版」／裝了新黑「板」'],a:3,

{c:'形近字',q:'每到假日，名勝古「○」湧入遊客。但假日一過，堆「△」如山的垃圾讓清潔人員苦不堪言。○△依序該填什麼？',o:['積／積','蹟／蹟','蹟／積','積／蹟'],a:2,

{c:'形近字',q:'下列哪一組「」中的字形是正確的？',o:['名勝古「積」／堆「積」如山','拋在「腦」後／自尋煩「惱」','「檢」查作業／「檢」舉違規','「籃」球比賽／「籃」天白雲'],a:2,

{c:'形近字',q:'他既然「決」定要辭職，就「○」對不會接受任何人慰留。○應填什麼字？',o:['決','絕','抉','訣'],a:1,
 x:'「絕對」的「絕」！「決」是用在「決定」，「絕」表示完全、斷絕。這是常考的形近字！（112年Q4）'},
{c:'詞語解釋',q:'下列哪一個選項是「恍然大悟」的意思？',o:['頭昏後才明白','忽然完全明白','早就已經明白','心裡好像明白'],a:1,
 x:'「恍然大悟」就是突然間完全明白的意思！恍=忽然、悟=明白。（111年Q5）'},
{c:'詞語解釋',q:'下列詞語的解釋，何者正確？',o:['和顏悅色：臉上布滿五顏六色的光彩','喜上眉梢：喜悅之情流露在眉宇之間','手舞足蹈：難過時手和腳都舞動跳躍','眉開眼笑：眉毛跟眼睛都在笑'],a:1,

{c:'詞語解釋',q:'下列哪個詞語和「無拘無束」的意思最接近？',o:['自由自在','無憂無慮','樂在其中','心平氣和'],a:0,

{c:'句型',q:'下列哪一個選項是「因果句型」？',o:['爸爸的車拋錨，所以上班遲到了','如果你上課專心聽講，就會寫作業','起先我用鉛筆畫線條，再來用水彩上色','這次戶外教學，讓我既興奮又期待'],a:0,

 x:'這是「條件句」！關鍵詞是「只有……才能……」，表示必須先做到某個條件，才會有後面的結果。（111年Q7類似題）'},
{c:'標點',q:'「你快點說吧□這枝掃把是不是你弄斷的□」□中依序應填入？',o:['，。','！。','，？','！？'],a:3,
 x:'「你快點說吧」是命令語氣用驚嘆號（！），「是不是你弄斷的」是問句用問號（？）。（114年Q9）'}
];

const TOTAL=Q.length;

// ═══ 遊戲狀態 ═══
let pN='',qi=0,sc=0,co=0,wr=[];
let gs=0,aw=false,tm=null,tl=40;
const QT=40;

// 類別追蹤
const cats={};Q.forEach((q,i)=>{if(!cats[q.c])cats[q.c]=[];cats[q.c].push(i);});
let catPerf={}; // {cat: {correct:0, total:0}}

const $=id=>document.getElementById(id);

// ═══ 畫面 ═══
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}

// ═══ 開始 ═══
const ni=$('ni'),bg=$('bg');
ni.addEventListener('input',()=>{bg.disabled=ni.value.trim().length<1});
ni.addEventListener('keydown',e=>{if(e.key==='Enter'&&!bg.disabled)start()});
bg.addEventListener('click',start);

function start(){
  pN=ni.value.trim();if(!pN)return;
  qi=0;sc=0;co=0;wr=[];gs=Date.now();
  catPerf={};Q.forEach(q=>{if(!catPerf[q.c])catPerf[q.c]={correct:0,total:0};catPerf[q.c].total++;});
  $('cs').textContent='0';$('pbar').style.width='0%';$('pmarkers').innerHTML='';
  const ms=document.getElementById('pmarkers');
  for(let i=1;i<=TOTAL;i++){const s=document.createElement('span');s.textContent=i;ms.appendChild(s);}
  $('rguy').style.left='0%';
  show('scrGame');sq();
}

// ═══ 顯示題目 ═══
function sq(){
  if(qi>=TOTAL){sr();return;}
  const qd=Q[qi];
  $('qn').textContent='第 '+(qi+1)+' / '+TOTAL+' 題 ['+qd.c+']';
  $('qt').textContent=qd.q;
  $('fb').textContent='';$('fb').className='fb';
  $('ex').style.display='none';$('ex').textContent='';
  $('aiDlg').style.display='none';$('aiDlg').innerHTML='';
  $('bn').style.display='none';

  const ob=$('ob');ob.innerHTML='';
  const lb=['A','B','C','D'];
  qd.o.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.textContent=lb[i]+'. '+o;
    b.addEventListener('click',()=>sel(i));ob.appendChild(b);
  });

  tl=QT;$('td').textContent=tl;$('tb').className='badge bt';
  aw=true;clearInterval(tm);
  tm=setInterval(()=>{tl--;$('td').textContent=tl;
    if(tl<=20)$('tb').className='badge bt warn';
    if(tl<=8)$('tb').className='badge bt danger';
    if(tl<=0){clearInterval(tm);tu();}},1000);
}

// ═══ 時間到 ═══
function tu(){
  if(!aw)return;aw=false;
  const qd=Q[qi];wr.push({q:qd.q,o:qd.o,a:qd.a,ch:-1,c:qd.c,x:qd.x});
  catPerf[qd.c].total++;
  document.querySelectorAll('.opt').forEach((b,i)=>{b.classList.add('dis');if(i===qd.a)b.classList.add('correct');});
  $('fb').textContent='⏰ 時間到！';$('fb').className='fb ng';
  $('tb').className='badge bt';
  $('bn').style.display='inline-block';$('bn').textContent='看 AI 解析後繼續 ▶';
}

// ═══ 選擇答案 ═══
function sel(idx){
  if(!aw)return;aw=false;clearInterval(tm);
  const qd=Q[qi];
  catPerf[qd.c].total++;
  const bs=document.querySelectorAll('.opt');
  bs.forEach(b=>b.classList.add('dis'));
  bs[qd.a].classList.add('correct');
  const ok=idx===qd.a;
  if(ok){
    catPerf[qd.c].correct++;
    const bonus=Math.floor(tl/2);
    const pts=20+bonus;sc+=pts;co++;
    $('cs').textContent=sc;
    $('fb').innerHTML='✅ 太棒了！你答對了！（+'+pts+' 分）';
    $('fb').className='fb ok';
    $('ex').textContent='💡 '+qd.x;$('ex').style.display='block';
    $('bn').textContent='下一題 ▶';$('bn').style.display='inline-block';
  }else{
    wr.push({q:qd.q,o:qd.o,a:qd.a,ch:idx,c:qd.c,x:qd.x});
    bs[idx].classList.add('wrong');
    $('fb').textContent='❌ 答錯了，沒關係！讓我們來看看為什麼。';
    $('fb').className='fb ng';
    getAIFix(qd,idx);
  }
  $('tb').className='badge bt';
  updateProgress();
}

// ═══ AI 引導（答錯時）════
async function getAIFix(qd,chosen){
  const dlg=$('aiDlg');
  dlg.style.display='block';dlg.innerHTML='<div class="ai-loading">🤖 AI 老師正在分析你的答題狀況...</div>';
  const lb=['A','B','C','D'];
  const prompt=`你是國小四年級國語補救教學老師。學生答錯了這題：\n題目：${qd.q}\n學生選了：${lb[chosen]}. ${qd.o[chosen]}\n正確答案：${lb[qd.a]}. ${qd.o[qd.a]}\n\n請用短短3-4句話，以溫和、鼓勵的語氣（像老師跟小朋友說話），簡單解釋為什麼正確答案是這個。不要批評學生，要說「沒關係，我們一起看看」。語氣要像在跟四年級小朋友一對一對話。`;
  try{
    const res=await fetch('https://kkqsqlwlxeffdoondlcj.supabase.co/functions/v1/ai-tutor',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    if(data.choices&&data.choices[0]){
      dlg.innerHTML='<div class="ai-label">🤖 AI 老師說：</div>'+data.choices[0].message.content;
    }else{
      dlg.innerHTML='<div class="ai-label">💡 解析：</div>'+qd.x;
    }
  }catch(e){
    dlg.innerHTML='<div class="ai-label">💡 解析：</div>'+qd.x;
  }
  $('bn').textContent='下一題 ▶';$('bn').style.display='inline-block';
}

// ═══ 更新進度條 ═══
function updateProgress(){
  const pct=(qi+1)/TOTAL*100;
  $('pbar').style.width=pct+'%';
  $('rguy').style.left=pct+'%';
}

$('bn').addEventListener('click',()=>{qi++;updateProgress();sq();});

document.addEventListener('keydown',e=>{if(!aw)return;const k=e.key;if(k>='1'&&k<='4')sel(parseInt(k)-1);});

// ═══ 結果 ═══
async function sr(){
  const sec=Math.floor((Date.now()-gs)/1000);
  const m=Math.floor(sec/60),s=sec%60;
  const ts=m>0?m+' 分 '+s+' 秒':s+' 秒';
  const max=TOTAL*25;
  $('rn').textContent=pN;$('rs').textContent=sc+' / '+max;
  $('rc').textContent=co+' / '+TOTAL+' 題';$('rt').textContent=ts;

  let rc='rn',rt='繼續加油！💪';
  const pct=sc/max;
  if(pct>=.9){rc='rg';rt='🏅 國語大師！';}
  else if(pct>=.7){rc='rs';rt='🥈 國語高手！';}
  else if(pct>=.5){rc='rb';rt='🥉 國語好手！';}
  $('rr').innerHTML='<div class="rank '+rc+'">'+rt+'</div>';

  // 診斷圖
  buildDiag();

  show('scrResult');

  // 儲存
  $('ss').textContent='正在儲存...';
  if(sb){
    try{
      await sb.from('chinese_game_records').insert({student_name:pN,score:sc,correct_count:co,total_questions:TOTAL,time_seconds:sec,game_type:'final'});
      $('ss').textContent='✅ 已儲存！';$('ss').style.color='#059669';
    }catch(e){$('ss').textContent='⚠️ 儲存失敗';$('ss').style.color='#dc2626';}
  }else{$('ss').textContent='⚠️ 離線模式';$('ss').style.color='#d97706';}
  loadLB();

  // AI 總分析
  if(wr.length>0){await aiSummary();}
}

function buildDiag(){
  const db=$('diag');
  let h='<h3>📊 學習診斷分析</h3>';
  const allCats=Object.keys(catPerf).sort();
  allCats.forEach(c=>{
    const d=catPerf[c];
    const p=d.correct/d.total*100;
    const cls=p>=80?'df-g':p>=50?'df-y':'df-r';
    const emoji=p>=80?'✅':p>=50?'⚠️':'❌';
    h+=`<div class="diag-bar">
      <span class="diag-label">${c}</span>
      <div class="diag-track"><div class="diag-fill ${cls}" style="width:${Math.max(p,10)}%"></div></div>
      <span class="diag-pct">${emoji} ${Math.round(p)}%</span>
    </div>`;
  });
  db.innerHTML=h;
}

async function aiSummary(){
  const aic=$('aic');aic.style.display='block';
  aic.innerHTML='<div class="ai-loading">🤖 AI 正在為你生成個人化診斷報告...</div>';
  const lb=['A','B','C','D'];
  const wrongSummary=wr.map(w=>`題目：${w.q}\n你選了：${w.chosen>=0?lb[w.chosen]:'未作答'}，正確是：${lb[w.a]}`).join('\n---\n');
  const prompt=`你是國小四年級國語補救教學老師。學生${pN}完成20題測驗，答對${co}/20題（得分${sc}分）。\n答錯的：\n${wrongSummary}\n\n請用100-150字：
1. 一句溫暖的鼓勵
2. 指出他最需要加強的1-2個方向
3. 給一個簡單可行的學習小建議\n語氣要溫暖、簡單，適合四年級小朋友。`;
  try{
    const res=await fetch('https://kkqsqlwlxeffdoondlcj.supabase.co/functions/v1/ai-tutor',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    if(data.choices&&data.choices[0]){
      aic.innerHTML='<h3>🤖 AI 個人化診斷報告</h3>'+data.choices[0].message.content.split('\n').filter(l=>l.trim()).map(l=>'<p>'+l+'</p>').join('');
    }
  }catch(e){aic.style.display='none';}
}

async function loadLB(){
  const lb=$('lb');if(!sb){lb.innerHTML='';return;}
  try{
    const {data}=await sb.from('chinese_game_records').select('student_name,score,time_seconds').order('score',{ascending:false}).order('time_seconds',{ascending:true}).limit(10);
    if(!data||!data.length)return;
    let h='<h3>🏅 排行榜</h3>';
    data.forEach((r,i)=>{
      const med=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
      const m2=Math.floor(r.time_seconds/60),s2=r.time_seconds%60;
      const t2=m2>0?m2+'分'+s2+'秒':s2+'秒';
      h+='<div class="lb-i"><span>'+med+'</span><span class="lb-n">'+esc(r.student_name)+'</span><span class="lb-s">'+r.score+'分·'+t2+'</span></div>';
    });
    lb.innerHTML=h;
  }catch(e){}
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

$('br').addEventListener('click',()=>{show('scrStart');ni.focus();});
</script>
</body>
</html>
