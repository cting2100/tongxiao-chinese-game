<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銅小四年級國語補救教學 — 每日闖關遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;
}
.bg-stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-stars span{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}

.container{position:relative;z-index:1;width:95vw;max-width:750px;min-height:460px;
  background:rgba(255,255,255,.93);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  padding:28px 24px;text-align:center;transition:all .4s}

.screen{display:none}
.screen.active{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

h1{font-size:1.8em;color:#2d1b69;margin-bottom:6px}
h2{font-size:1.3em;color:#5b3a8c;margin-bottom:12px}
.sub{color:#7c6ba0;font-size:.9em;margin-bottom:10px}

/* 開始畫面 */
.hero{font-size:4em;margin:8px 0}
.desc{background:#f3effa;border-radius:14px;padding:14px;margin:12px 0;text-align:left;font-size:.9em;color:#4a3b6b;line-height:1.7}
.desc b{color:#6d28d9}

.inp-group{margin:16px 0}
.inp-group label{display:block;font-size:1em;color:#2d1b69;font-weight:bold;margin-bottom:6px}
.inp-group input{width:100%;max-width:320px;padding:12px 18px;border:3px solid #d4c8f0;border-radius:12px;font-size:1.1em;text-align:center;outline:none;transition:border .3s}
.inp-group input:focus{border-color:#7c5ce7}

.btn{display:inline-block;padding:12px 32px;border:none;border-radius:12px;font-size:1.1em;font-weight:bold;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.btn:active{transform:translateY(0)}
.btn-pri{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff}
.btn-suc{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
.btn-war{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.btn-lg{padding:14px 44px;font-size:1.3em}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{padding:8px 20px;font-size:.9em}

/* 選天畫面 */
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:16px 0}
.day-card{
  background:#f8f6fc;border:2px solid #e8e0f5;border-radius:14px;
  padding:18px 10px;cursor:pointer;transition:all .2s;text-align:center
}
.day-card:hover{border-color:#a78bfa;background:#faf8ff;transform:translateY(-3px);box-shadow:0 4px 12px rgba(124,92,231,.15)}
.day-card .day-icon{font-size:2em;display:block;margin-bottom:4px}
.day-card .day-label{font-size:.85em;color:#5b3a8c;font-weight:bold}
.day-card .day-desc{font-size:.7em;color:#9c8cb5;margin-top:2px}
.day-card.final{background:#fff7ed;border-color:#fbbf24}

/* 遊戲中 */
.game-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.badge{color:#fff;padding:5px 14px;border-radius:20px;font-size:.85em;font-weight:bold}
.badge-stage{background:linear-gradient(135deg,#7c5ce7,#a855f7)}
.badge-score{background:#f3effa;color:#5b3a8c}
.badge-time{background:#f3effa;color:#5b3a8c;font-weight:bold}
.badge-time.warn{background:#fef3c7;color:#d97706}
.badge-time.danger{background:#fee2e2;color:#dc2626;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.q-area{margin:14px 0}
.q-num{font-size:.8em;color:#9c8cb5;margin-bottom:4px}
.q-text{font-size:1.25em;color:#1e1040;font-weight:bold;background:#f8f6fc;padding:18px;border-radius:14px;line-height:1.7;margin-bottom:12px;text-align:left}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:block;width:100%;padding:14px 18px;border:3px solid #e8e0f5;border-radius:12px;
  background:#fff;font-size:1.05em;cursor:pointer;text-align:left;transition:all .2s;font-family:inherit;color:#2d1b69
}
.opt:hover{border-color:#a78bfa;background:#faf8ff}
.opt.correct{border-color:#10b981!important;background:#d1fae5!important;color:#065f46!important;animation:pop .3s}
.opt.wrong{border-color:#ef4444!important;background:#fee2e2!important;color:#991b1b!important;animation:shake .4s}
.opt.disabled{pointer-events:none;opacity:.7}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.fb{font-size:1.1em;font-weight:bold;margin:10px 0;min-height:28px}
.fb.ok{color:#059669}
.fb.ng{color:#dc2626}

/* 結果 */
.stats{margin:14px auto;max-width:420px}
.stat-row{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #e8e0f5;font-size:1.05em}
.stat-row:last-child{border-bottom:none}
.stat-l{color:#7c6ba0}.stat-v{color:#2d1b69;font-weight:bold}

.rank{display:inline-block;padding:6px 20px;border-radius:18px;font-size:1.1em;font-weight:bold;margin:10px 0}
.rank-gold{background:#fef3c7;color:#92400e}
.rank-silver{background:#e2e8f0;color:#475569}
.rank-bronze{background:#fde68a;color:#92400e}
.rank-norm{background:#f3effa;color:#5b3a8c}

.saving{color:#7c6ba0;font-size:.85em;margin:6px 0}

.lb{margin:12px auto;max-width:500px;text-align:left}
.lb h3{color:#5b3a8c;margin-bottom:6px}
.lb-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#f8f6fc;border-radius:8px;margin:3px 0;font-size:.9em}
.lb-rank{font-size:1.1em;width:30px}
.lb-name{flex:1;color:#2d1b69;font-weight:bold;padding:0 8px}
.lb-score{color:#7c5ce7;font-weight:bold}
.lb-type{color:#9c8cb5;font-size:.75em;margin-left:4px}

@media(max-width:480px){
  .container{padding:18px 12px}
  h1{font-size:1.3em}
  .q-text{font-size:1.05em;padding:12px}
  .opt{font-size:.95em;padding:10px 14px}
  .day-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
}
</style>
</head>
<body>

<div class="bg-stars" id="stars"></div>

<div class="container">

<!-- ===== 1. 開始畫面 ===== -->
<div class="screen active" id="scrStart">
  <div class="hero">🏫</div>
  <h1>銅小四年級國語補救教學</h1>
  <h2>每日闖關遊戲</h2>
  <div class="desc">
    <p><b>遊戲說明：</b></p>
    <p>• 共 10 天關卡 + 1 場總複習，依照每日上課進度設計</p>
    <p>• 每題 30 秒限時，答對每題最高可得 25 分</p>
    <p>• 題目來自 110-114 年學力檢測題型</p>
  </div>
  <div class="inp-group">
    <label for="nameInp">請輸入你的名字：</label>
    <input type="text" id="nameInp" placeholder="例如：小明" maxlength="20" autocomplete="off">
  </div>
  <button class="btn btn-pri btn-lg" id="btnGo" disabled>選擇關卡 ▶</button>
</div>

<!-- ===== 2. 選天畫面 ===== -->
<div class="screen" id="scrMenu">
  <h1>選擇挑戰關卡</h1>
  <p class="sub" id="menuPlayer"></p>
  <div class="day-grid" id="dayGrid"></div>
  <button class="btn btn-war btn-sm" id="btnBack" style="margin-top:10px">← 換名字</button>
</div>

<!-- ===== 3. 遊戲中 ===== -->
<div class="screen" id="scrGame">
  <div class="game-top">
    <span class="badge badge-stage" id="stageName"></span>
    <span class="badge badge-score">⭐ <span id="curScore">0</span> 分</span>
    <span class="badge badge-time" id="timeBadge">⏱ <span id="timeDisp">30</span>s</span>
  </div>
  <div class="q-area">
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="optsBox"></div>
    <div class="fb" id="fb"></div>
  </div>
  <button class="btn btn-pri" id="btnNextQ" style="display:none">下一題 ▶</button>
</div>

<!-- ===== 4. 結果畫面 ===== -->
<div class="screen" id="scrResult">
  <div style="font-size:4em;margin:6px 0" id="resIcon"></div>
  <h1 id="resTitle"></h1>
  <div id="resRank"></div>
  <div class="stats">
    <div class="stat-row"><span class="stat-l">玩家</span><span class="stat-v" id="resName"></span></div>
    <div class="stat-row"><span class="stat-l">關卡</span><span class="stat-v" id="resGame"></span></div>
    <div class="stat-row"><span class="stat-l">得分</span><span class="stat-v" id="resScore"></span></div>
    <div class="stat-row"><span class="stat-l">答對</span><span class="stat-v" id="resCorrect"></span></div>
    <div class="stat-row"><span class="stat-l">時間</span><span class="stat-v" id="resTime"></span></div>
  </div>
  <div class="saving" id="savingStat"></div>
  <div class="lb" id="lbBox"></div>
  <button class="btn btn-pri btn-lg" id="btnMenu" style="margin-top:12px">選其他關卡 ▶</button>
</div>

</div>

let pName='',gameKey='',qIdx=0,score=0,correct=0,total=0;
let gameStart=0,qStart=0,answering=false,timer=null,timeLeft=30;
const Q_TIME=30;

// ═══════════════ DOM ═══════════════
const $=id=>document.getElementById(id);

// ═══════════════ 星星背景 ═══════════════
(function(){
  const c=$('stars');
  for(let i=0;i<50;i++){
    const s=document.createElement('span');
    const sz=Math.random()*3+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
    c.appendChild(s);
  }
})();

// ═══════════════ 畫面切換 ═══════════════
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

// ═══════════════ 1. 開始 → 輸入名字 ═══════════════
const nameInp=$('nameInp'),btnGo=$('btnGo');
nameInp.addEventListener('input',()=>{btnGo.disabled=nameInp.value.trim().length<1});
nameInp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btnGo.disabled)goMenu();});
btnGo.addEventListener('click',goMenu);

function goMenu(){
  pName=nameInp.value.trim();
  if(!pName)return;
  $('menuPlayer').textContent='玩家：'+pName+'，請選擇要挑戰的關卡：';
  buildDayGrid();
  show('scrMenu');
}

// ═══════════════ 2. 選天 ═══════════════
function buildDayGrid(){
  const grid=$('dayGrid');
  let h='';
  for(let d=1;d<=10;d++){
    const g=Qs['day'+d];
    h+=`<div class="day-card" data-game="day${d}">
      <span class="day-icon">${g.icon}</span>
      <span class="day-label">${g.name}</span>
      <span class="day-desc">${g.desc}</span>
    </div>`;
  }
  h+=`<div class="day-card final" data-game="final">
    <span class="day-icon">🏆</span>
    <span class="day-label">總複習大挑戰</span>
    <span class="day-desc">25題綜合檢測</span>
  </div>`;
  grid.innerHTML=h;
  grid.querySelectorAll('.day-card').forEach(c=>{
    c.addEventListener('click',()=>startGame(c.dataset.game));
  });
}

$('btnBack').addEventListener('click',()=>show('scrStart'));

// ═══════════════ 3. 開始遊戲 ═══════════════
function startGame(key){
  gameKey=key;
  score=0;correct=0;total=0;qIdx=0;
  const qs=key==='final'?finalQs:Qs[key].qs;
  total=qs.length;
  const gn=key==='final'?'總複習大挑戰':Qs[key].name;
  $('stageName').textContent=gn;
  $('curScore').textContent='0';
  gameStart=Date.now();
  show('scrGame');
  showQuestion();
}

function showQuestion(){
  const qs=gameKey==='final'?finalQs:Qs[gameKey].qs;
  if(qIdx>=qs.length){showResult();return;}
  const qd=qs[qIdx];
  $('qNum').textContent=`第 ${qIdx+1} / ${qs.length} 題`;
  $('qText').textContent=qd.q;
  $('fb').textContent='';$('fb').className='fb';
  $('btnNextQ').style.display='none';

  const ob=$('optsBox');
  ob.innerHTML='';
  const labels=['A','B','C','D'];
  qd.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=labels[i]+'. '+o;
    b.addEventListener('click',()=>select(i));
    ob.appendChild(b);
  });

  timeLeft=Q_TIME;
  $('timeDisp').textContent=timeLeft;
  $('timeBadge').className='badge badge-time';
  qStart=Date.now();
  answering=true;
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    $('timeDisp').textContent=timeLeft;
    if(timeLeft<=15)$('timeBadge').className='badge badge-time warn';
    if(timeLeft<=6)$('timeBadge').className='badge badge-time danger';
    if(timeLeft<=0){clearInterval(timer);timeUp();}
  },1000);
}

function timeUp(){
  if(!answering)return;
  answering=false;
  const qs=gameKey==='final'?finalQs:Qs[gameKey].qs;
  const qd=qs[qIdx];
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===qd.ans)b.classList.add('correct');
  });
  $('fb').textContent='⏰ 時間到！答案：'+['A','B','C','D'][qd.ans];
  $('fb').className='fb ng';
  $('timeBadge').className='badge badge-time';
  $('btnNextQ').style.display='inline-block';
}

function select(idx){
  if(!answering)return;
  answering=false;
  clearInterval(timer);
  const qs=gameKey==='final'?finalQs:Qs[gameKey].qs;
  const qd=qs[qIdx];
  const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.classList.add('disabled'));
  btns[qd.ans].classList.add('correct');
  const ok=idx===qd.ans;
  if(ok){
    const bonus=Math.floor(timeLeft/3);
    const pts=20+bonus;
    score+=pts;correct++;
    $('curScore').textContent=score;
    btns[idx].classList.add('correct');
    $('fb').textContent='✅ 答對了！+'+pts+' 分';
    $('fb').className='fb ok';
  }else{
    btns[idx].classList.add('wrong');
    $('fb').textContent='❌ 答錯了！答案：'+['A','B','C','D'][qd.ans];
    $('fb').className='fb ng';
  }
  $('timeBadge').className='badge badge-time';
  $('btnNextQ').style.display='inline-block';
}

$('btnNextQ').addEventListener('click',()=>{qIdx++;showQuestion();});

// 鍵盤 1-4 選答案
document.addEventListener('keydown',e=>{
  if(!answering)return;
  const k=e.key;
  if(k>='1'&&k<='4')select(parseInt(k)-1);
});

// ═══════════════ 4. 結果 ═══════════════
async function showResult(){
  const sec=Math.floor((Date.now()-gameStart)/1000);
  const m=Math.floor(sec/60),s=sec%60;
  const ts=m>0?m+' 分 '+s+' 秒':s+' 秒';
  const totalQs=gameKey==='final'?finalQs.length:Qs[gameKey].qs.length;
  const isFinal=gameKey==='final';
  const gn=isFinal?'總複習大挑戰':Qs[gameKey].name;

  $('resIcon').textContent=isFinal?'🏆':Qs[gameKey].icon;
  $('resTitle').textContent=gn+' 完成！';
  $('resName').textContent=pName;
  $('resGame').textContent=gn;
  $('resScore').textContent=score+' / '+(totalQs*25);
  $('resCorrect').textContent=correct+' / '+totalQs+' 題';
  $('resTime').textContent=ts;

  const max=totalQs*25;
  let rc='rank-norm',rt='繼續加油！';
  const pct=score/max;
  if(pct>=.9){rc='rank-gold';rt='🏅 國語大師！';}
  else if(pct>=.7){rc='rank-silver';rt='🥈 國語高手！';}
  else if(pct>=.5){rc='rank-bronze';rt='🥉 國語好手！';}
  $('resRank').innerHTML=`<div class="rank ${rc}">${rt}</div>`;

  show('scrResult');

  // 儲存
  $('savingStat').textContent='正在儲存...';
  if(!sb){ $('savingStat').textContent='⚠️ 離線模式，成績未儲存'; $('savingStat').style.color='#d97706'; return; }
  try{
    const {error}=await sb.from('chinese_game_records').insert({
      student_name:pName,score:score,correct_count:correct,
      total_questions:totalQs,time_seconds:sec,game_type:gameKey
    });
    if(error)throw error;
    $('savingStat').textContent='✅ 成績已儲存！';
    $('savingStat').style.color='#059669';
  }catch(e){
    console.error(e);
    $('savingStat').textContent='⚠️ 儲存失敗（請截圖保存）';
    $('savingStat').style.color='#dc2626';
  }
  loadLB();
}

async function loadLB(){
  const lb=$('lbBox');
  if(!sb){ lb.innerHTML='<p style="text-align:center;color:#9c8cb5;">離線模式</p>'; return; }
  try{
    const {data,error}=await sb.from('chinese_game_records')
      .select('student_name,score,time_seconds,game_type')
      .order('score',{ascending:false}).order('time_seconds',{ascending:true}).limit(15);
    if(error)throw error;
    if(!data||!data.length){lb.innerHTML='<p style="text-align:center;color:#9c8cb5;">尚無記錄</p>';return;}
    let h='<h3>🏅 排行榜</h3>';
    data.forEach((r,i)=>{
      const med=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
      const m2=Math.floor(r.time_seconds/60),s2=r.time_seconds%60;
      const t2=m2>0?m2+'分'+s2+'秒':s2+'秒';
      const typeName=r.game_type==='final'?'總複習':(Qs[r.game_type]?Qs[r.game_type].name.replace('Day','D'):r.game_type);
      h+=`<div class="lb-item">
        <span class="lb-rank">${med}</span>
        <span class="lb-name">${esc(r.student_name)}<span class="lb-type">${typeName}</span></span>
        <span class="lb-score">${r.score}分·${t2}</span>
      </div>`;
    });
    lb.innerHTML=h;
  }catch(e){lb.innerHTML='<p style="text-align:center;color:#9c8cb5;">載入失敗</p>';}
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

$('btnMenu').addEventListener('click',()=>{
  buildDayGrid();show('scrMenu');
});

})();
</script>
