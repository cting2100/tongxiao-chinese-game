<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>銅小四年級國語補救教學 — 總複習挑戰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.container{
  position:relative;z-index:1;width:95vw;max-width:750px;
  background:rgba(255,255,255,.93);border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);padding:28px 24px;text-align:center;
}

/* 畫面 */
.scr{display:none}.scr.on{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

h1{font-size:1.8em;color:#2d1b69;margin-bottom:6px}
h2{font-size:1.3em;color:#5b3a8c;margin-bottom:12px}
.sub{color:#7c6ba0;font-size:.9em;margin-bottom:10px}

.desc{
  background:#f3effa;border-radius:14px;padding:14px;margin:12px 0;
  text-align:left;font-size:.9em;color:#4a3b6b;line-height:1.8
}
.desc b{color:#6d28d9}

.inp{margin:16px 0}
.inp label{display:block;font-size:1em;color:#2d1b69;font-weight:bold;margin-bottom:6px}
.inp input{
  width:100%;max-width:320px;padding:12px 18px;border:3px solid #d4c8f0;
  border-radius:12px;font-size:1.1em;text-align:center;outline:none;transition:border .3s
}
.inp input:focus{border-color:#7c5ce7}

.btn{
  display:inline-block;padding:12px 32px;border:none;border-radius:12px;
  font-size:1.1em;font-weight:bold;cursor:pointer;transition:all .2s;font-family:inherit
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.btn:active{transform:translateY(0)}
.btn-pri{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff}
.btn-suc{background:linear-gradient(135deg,#10b981,#34d399);color:#fff}
.btn-war{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
.btn-lg{padding:14px 44px;font-size:1.3em}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* 遊戲中 */
.game-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.badge{padding:5px 14px;border-radius:20px;font-size:.85em;font-weight:bold}
.badge-stage{background:linear-gradient(135deg,#7c5ce7,#a855f7);color:#fff}
.badge-score{background:#f3effa;color:#5b3a8c}
.badge-time{background:#f3effa;color:#5b3a8c}
.badge-time.warn{background:#fef3c7;color:#d97706}
.badge-time.danger{background:#fee2e2;color:#dc2626;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.q-area{margin:14px 0}
.q-num{font-size:.8em;color:#9c8cb5;margin-bottom:4px}
.q-text{font-size:1.25em;color:#1e1040;font-weight:bold;background:#f8f6fc;padding:18px;border-radius:14px;line-height:1.7;margin-bottom:12px;text-align:left}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:block;width:100%;padding:14px 18px;border:3px solid #e8e0f5;border-radius:12px;
  background:#fff;font-size:1.05em;cursor:pointer;text-align:left;transition:all .2s;font-family:inherit;color:#2d1b69
}
.opt:hover{border-color:#a78bfa;background:#faf8ff}
.opt.correct{border-color:#10b981!important;background:#d1fae5!important;color:#065f46!important;animation:pop .3s}
.opt.wrong{border-color:#ef4444!important;background:#fee2e2!important;color:#991b1b!important;animation:shake .4s}
.opt.disabled{pointer-events:none;opacity:.7}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.fb{font-size:1.1em;font-weight:bold;margin:10px 0;min-height:28px}
.fb.ok{color:#059669}.fb.ng{color:#dc2626}

/* 結果 */
.stats{margin:14px auto;max-width:420px}
.stat-row{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #e8e0f5;font-size:1.05em}
.stat-row:last-child{border-bottom:none}
.stat-l{color:#7c6ba0}.stat-v{color:#2d1b69;font-weight:bold}

.rank{display:inline-block;padding:6px 20px;border-radius:18px;font-size:1.1em;font-weight:bold;margin:10px 0}
.rank-gold{background:#fef3c7;color:#92400e}
.rank-silver{background:#e2e8f0;color:#475569}
.rank-bronze{background:#fde68a;color:#92400e}
.rank-norm{background:#f3effa;color:#5b3a8c}

.saving{color:#7c6ba0;font-size:.85em;margin:6px 0}

.lb{margin:12px auto;max-width:500px;text-align:left}
.lb h3{color:#5b3a8c;margin-bottom:6px}
.lb-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#f8f6fc;border-radius:8px;margin:3px 0;font-size:.9em}
.lb-name{flex:1;color:#2d1b69;font-weight:bold;padding:0 8px}
.lb-score{color:#7c5ce7;font-weight:bold}

@media(max-width:480px){
  .container{padding:18px 12px}
  h1{font-size:1.3em}
  .q-text{font-size:1.05em;padding:12px}
  .opt{font-size:.95em;padding:10px 14px}
}
</style>
</head>
<body>

<div class="container">

<!-- 開始畫面 -->
<div class="scr on" id="scrStart">
  <div style="font-size:4em;margin:8px 0">🏆</div>
  <h1>國語補救教學總複習</h1>
  <h2>25 題綜合挑戰（110-114 學力檢測題型）</h2>
  <div class="desc">
    <p><b>遊戲說明：</b></p>
    <p>• 每題 <b>30 秒</b>限時，答對一題最高可得 25 分（滿分 625 分）</p>
    <p>• 涵蓋：讀音、形近字、句型、轉折詞、標點、修辭、閱讀理解</p>
    <p>• 題目參考 110-114 年縣市學力檢測四年級國語科</p>
  </div>
  <div class="inp">
    <label for="nameInp">請輸入你的名字：</label>
    <input type="text" id="nameInp" placeholder="例如：小明" maxlength="20" autocomplete="off">
  </div>
  <button class="btn btn-pri btn-lg" id="btnGo" disabled>開始挑戰 ▶</button>
  <p style="color:#9c8cb5;font-size:.8em;margin-top:6px">輸入名字後即可開始</p>
</div>

<!-- 遊戲中 -->
<div class="scr" id="scrGame">
  <div class="game-top">
    <span class="badge badge-stage">總複習挑戰</span>
    <span class="badge badge-score">⭐ <span id="curScore">0</span> 分</span>
    <span class="badge badge-time" id="timeBadge">⏱ <span id="timeDisp">30</span>s</span>
  </div>
  <div class="q-area">
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="optsBox"></div>
    <div class="fb" id="fb"></div>
  </div>
  <button class="btn btn-pri" id="btnNext" style="display:none">下一題 ▶</button>
</div>

<!-- 結果 -->
<div class="scr" id="scrResult">
  <div style="font-size:4em;margin:6px 0">🏅</div>
  <h1>挑戰完成！</h1>
  <div id="resRank"></div>
  <div class="stats">
    <div class="stat-row"><span class="stat-l">玩家</span><span class="stat-v" id="resName"></span></div>
    <div class="stat-row"><span class="stat-l">總分</span><span class="stat-v" id="resScore"></span></div>
    <div class="stat-row"><span class="stat-l">答對</span><span class="stat-v" id="resCorrect"></span></div>
    <div class="stat-row"><span class="stat-l">時間</span><span class="stat-v" id="resTime"></span></div>
  </div>
  <div class="saving" id="savingStat">正在儲存...</div>
  <div class="lb" id="lbBox"></div>
  <button class="btn btn-war btn-lg" id="btnRetry" style="margin-top:12px">再玩一次 🔄</button>
</div>

</div>

// ═══════════ 題庫（25 題，110-114 學力檢測題型）═══════════
const QUESTIONS=[
{q:'下列哪一個選項「」中讀音相同？',opts:['「輪」番上陣／天「倫」之樂','一「波」三折／「坡」度陡峭','「偏」遠地區／漫山「遍」野','「刻」骨銘心／應「該」愛護環境'],ans:1},
{q:'下列哪一組「」中的字形是正確的？',opts:['名勝古「積」／堆「積」如山','拋在「腦」後／自尋煩「惱」','「檢」查作業／「檢」舉違規','「籃」球比賽／「籃」天白雲'],ans:2},
{q:'「哥哥雖然已經很累了，但是為了明天的考試，他還是努力複習。」這是什麼句型？',opts:['轉折句','條件句','假設句','並列句'],ans:0},
{q:'氣象預報說降雨機率百分之百，因此我「肯定」今天「可能」會下雨。哪個詞刪除後句子更通順？',opts:['預報','因此','肯定','可能'],ans:2},
{q:'「火車緩緩駛出山洞後□映入眼簾的是藍天□白雲與大海。」□中依序應填入？',opts:['，，','。，','，、','。、'],ans:2},
{q:'「天上的星星一閃一閃的，正在對我眨眼睛。」這句話運用了什麼修辭手法？',opts:['譬喻','擬人','誇飾','設問'],ans:1},
{q:'下列哪一個選項是「恍然大悟」的意思？',opts:['頭昏後才明白','忽然完全明白','早就已經明白','心裡好像明白'],ans:1},
{q:'「只有每天注意飲食，並且持之以恆的運動，才能擁有健康的身體。」是什麼句型？',opts:['轉折句','條件句','因果句','並列句'],ans:1},
{q:'下列哪一個段落組成方式屬於「時間式」結構？',opts:['家中擺設→庭院風景→街道景色','早上搭車→午餐前參觀→下午闖關','糖廠大門→糖廠廣場→糖廠辦公室','校外教學原因→過程→感想'],ans:1},
{q:'下列哪一個選項使用「因果句型」？',opts:['爸爸的車拋錨，所以上班遲到了','如果你上課專心聽講，就會寫作業','起先我用鉛筆畫線條，再來用水彩上色','這次戶外教學，讓我既興奮又期待'],ans:0},
{q:'「雖然外面陰雨綿綿，但妹妹仍堅持去海洋樂園玩。」句中哪個是轉折詞？',opts:['雖然','但','去','玩'],ans:1},
{q:'「即使歷經一次又一次的受傷，姊姊也不會放棄喜愛的芭蕾舞。」主要意思是？',opts:['芭蕾舞練習常常使姊姊受傷','芭蕾舞是一種十分危險的舞蹈','受傷也無法阻止姊姊練習芭蕾舞','受到的傷愈嚴重表示姊姊愈厲害'],ans:2},
{q:'「一句溫暖的話，就像往別人身上灑香水，自己也會聞到香味。」涵義是？',opts:['口說好話讓他人愉快，自己也會開心','想讓他人身上有香水味，就要說溫暖的話','說話時要保持口氣清新，才能感受到香氣','和別人說話時氣氛愉快，就要灑香水'],ans:0},
{q:'下列哪個選項「沒有」運用擬人法？',opts:['迎風搖曳的樹枝正在向人們打招呼','路燈在深夜裡為晚歸的人們站崗','汽車在高速公路上發出怒吼','房間裡安靜得連一根針掉在地上都能聽見'],ans:3},
{q:'校園裡有許多花，可以看到杜鵑花□櫻花□桃花□迎風搖曳。□中依序應填入？',opts:['，，、','、、，','，，─','、、；'],ans:1},
{q:'依據文本特徵，下面這段屬於哪一種文本？「鯨豚類，體型大者稱鯨，小者稱豚。大部分棲息於淺海。」',opts:['抒情文','應用文','說明文','議論文'],ans:2},
{q:'「醋能幫助身體中血液維持弱鹼性……更能抑制高血壓及肥胖。」這段文字主要在說？',opts:['醋的發明','醋的好處','醋的研究','醋的味道'],ans:1},
{q:'「微風輕拂臉龐，帶來一股淡淡的花香，金色的陽光灑進樹林。」運用了哪些感覺？',opts:['觸覺、嗅覺、視覺','觸覺、視覺、嗅覺','嗅覺、觸覺、聽覺','嗅覺、聽覺、視覺'],ans:0},
{q:'「____下雨了，我____帶雨傘。」空格應填入？',opts:['雖然／但是','因為／所以','不但／而且','只有／才能'],ans:1},
{q:'文文把同學心愛的筆弄壞了，正煩惱怎樣跟同學說。最適合形容她心情的詞是？',opts:['迫不及待','忐忑不安','手忙腳亂','小心翼翼'],ans:1},
{q:'下列哪一個選項用了「誇飾」手法？',opts:['哥哥的力氣大到足以抬起一棟房子','妹妹的哭聲讓全家人都跑過來關心','媽媽煮菜的香氣連隔壁鄰居都聞得到','阿嬤擦過的窗戶總是特別的光亮潔淨'],ans:0},
{q:'下列哪一個選項「沒有」轉折詞？',opts:['雖然下雨，但我還是出門','因為下雨，所以我帶雨傘','他個子小，但是力氣大','這道菜很簡單，卻很好吃'],ans:1},
{q:'「他既然『決』定要辭職，就『 』對不會接受任何人的慰留。」空格應填入？',opts:['決','絕','抉','訣'],ans:1},
{q:'下列哪篇文章結構屬於「因果式」？',opts:['春天來了→夏天鳳凰花開→秋天落葉紛飛','學校前庭→教學大樓→後方操場','人類製造塑膠→廢棄塑膠流入海裡→海洋生物受威脅','我的興趣很廣泛→喜歡閱讀→也喜歡運動'],ans:2},
{q:'故事山的「山頂」代表故事的哪個階段？',opts:['開始（背景介紹）','經過（事件發展）','高潮（最緊張精彩處）','結果（事件結束）'],ans:2}
];

// ═══════════ 遊戲狀態 ═══════════
let pName='',qIdx=0,score=0,correct=0;
let gameStart=0,answering=false,timer=null,timeLeft=30;
const Q_TIME=30,TOTAL=QUESTIONS.length;

// ═══════════ DOM ═══════════
const $=id=>document.getElementById(id);

// ═══════════ 畫面切換 ═══════════
function show(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
}

// ═══════════ 開始 ═══════════
const nameInp=$('nameInp'),btnGo=$('btnGo');
nameInp.addEventListener('input',()=>{btnGo.disabled=nameInp.value.trim().length<1});
nameInp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btnGo.disabled)startGame()});
btnGo.addEventListener('click',startGame);

function startGame(){
  pName=nameInp.value.trim();
  if(!pName)return;
  qIdx=0;score=0;correct=0;gameStart=Date.now();
  $('curScore').textContent='0';
  show('scrGame');
  showQ();
}

// ═══════════ 顯示題目 ═══════════
function showQ(){
  if(qIdx>=TOTAL){showResult();return;}
  const qd=QUESTIONS[qIdx];
  $('qNum').textContent='第 '+(qIdx+1)+' / '+TOTAL+' 題';
  $('qText').textContent=qd.q;
  $('fb').textContent='';$('fb').className='fb';
  $('btnNext').style.display='none';

  const ob=$('optsBox');
  ob.innerHTML='';
  const labels=['A','B','C','D'];
  qd.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=labels[i]+'. '+o;
    b.addEventListener('click',()=>select(i));
    ob.appendChild(b);
  });

  timeLeft=Q_TIME;
  $('timeDisp').textContent=timeLeft;
  $('timeBadge').className='badge badge-time';
  answering=true;
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    $('timeDisp').textContent=timeLeft;
    if(timeLeft<=15)$('timeBadge').className='badge badge-time warn';
    if(timeLeft<=6)$('timeBadge').className='badge badge-time danger';
    if(timeLeft<=0){clearInterval(timer);timeUp();}
  },1000);
}

// ═══════════ 時間到 ═══════════
function timeUp(){
  if(!answering)return;
  answering=false;
  const qd=QUESTIONS[qIdx];
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===qd.ans)b.classList.add('correct');
  });
  $('fb').textContent='⏰ 時間到！正確答案：'+['A','B','C','D'][qd.ans];
  $('fb').className='fb ng';
  $('timeBadge').className='badge badge-time';
  $('btnNext').style.display='inline-block';
}

// ═══════════ 選擇答案 ═══════════
function select(idx){
  if(!answering)return;
  answering=false;
  clearInterval(timer);
  const qd=QUESTIONS[qIdx];
  const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.classList.add('disabled'));
  btns[qd.ans].classList.add('correct');
  const ok=idx===qd.ans;
  if(ok){
    const bonus=Math.floor(timeLeft/3);
    const pts=20+bonus;
    score+=pts;correct++;
    $('curScore').textContent=score;
    btns[idx].classList.add('correct');
    $('fb').textContent='✅ 答對了！+'+pts+' 分';
    $('fb').className='fb ok';
  }else{
    btns[idx].classList.add('wrong');
    $('fb').textContent='❌ 答錯了！正確答案：'+['A','B','C','D'][qd.ans];
    $('fb').className='fb ng';
  }
  $('timeBadge').className='badge badge-time';
  $('btnNext').style.display='inline-block';
}

$('btnNext').addEventListener('click',()=>{qIdx++;showQ();});

// 鍵盤 1-4 選答案
document.addEventListener('keydown',e=>{
  if(!answering)return;
  const k=e.key;
  if(k>='1'&&k<='4')select(parseInt(k)-1);
});

// ═══════════ 結果 ═══════════
async function showResult(){
  const sec=Math.floor((Date.now()-gameStart)/1000);
  const m=Math.floor(sec/60),s=sec%60;
  const ts=m>0?m+' 分 '+s+' 秒':s+' 秒';
  const max=TOTAL*25;

  $('resName').textContent=pName;
  $('resScore').textContent=score+' / '+max;
  $('resCorrect').textContent=correct+' / '+TOTAL+' 題';
  $('resTime').textContent=ts;

  let rc='rank-norm',rt='繼續加油！';
  const pct=score/max;
  if(pct>=.9){rc='rank-gold';rt='🏅 國語大師！';}
  else if(pct>=.7){rc='rank-silver';rt='🥈 國語高手！';}
  else if(pct>=.5){rc='rank-bronze';rt='🥉 國語好手！';}
  $('resRank').innerHTML='<div class="rank '+rc+'">'+rt+'</div>';

  show('scrResult');

  // 儲存
  $('savingStat').textContent='正在儲存...';
  if(!sb){$('savingStat').textContent='⚠️ 離線模式，成績未儲存';$('savingStat').style.color='#d97706';loadLB();return;}
  try{
    const {error}=await sb.from('chinese_game_records').insert({
      student_name:pName,score:score,correct_count:correct,
      total_questions:TOTAL,time_seconds:sec,game_type:'final'
    });
    if(error)throw error;
    $('savingStat').textContent='✅ 成績已儲存！';
    $('savingStat').style.color='#059669';
  }catch(e){
    console.error(e);
    $('savingStat').textContent='⚠️ 儲存失敗（請截圖保存）';
    $('savingStat').style.color='#dc2626';
  }
  loadLB();
}

async function loadLB(){
  const lb=$('lbBox');
  if(!sb){lb.innerHTML='<p style="text-align:center;color:#9c8cb5;">離線模式</p>';return;}
  try{
    const {data,error}=await sb.from('chinese_game_records')
      .select('student_name,score,time_seconds')
      .order('score',{ascending:false}).order('time_seconds',{ascending:true}).limit(15);
    if(error)throw error;
    if(!data||!data.length){lb.innerHTML='<p style="text-align:center;color:#9c8cb5;">尚無記錄</p>';return;}
    let h='<h3>🏅 排行榜</h3>';
    data.forEach((r,i)=>{
      const med=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
      const m2=Math.floor(r.time_seconds/60),s2=r.time_seconds%60;
      const t2=m2>0?m2+'分'+s2+'秒':s2+'秒';
      h+='<div class="lb-item"><span>'+med+'</span><span class="lb-name">'+esc(r.student_name)+'</span><span class="lb-score">'+r.score+'分·'+t2+'</span></div>';
    });
    lb.innerHTML=h;
  }catch(e){lb.innerHTML='<p style="text-align:center;color:#9c8cb5;">載入失敗</p>';}
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

$('btnRetry').addEventListener('click',()=>{show('scrStart');nameInp.focus();});
</script>
